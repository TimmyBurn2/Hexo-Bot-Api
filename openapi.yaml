components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Personal Access Token (PAT) sent as `Authorization: Bearer hxo_...`.
        Long-lived, revocable, scoped: play requires `bot:play`, registering
        instances requires `bot:register`, organizer operations (bulk pairing)
        require `bot:organize`. Each registered instance has its own token,
        independently revocable. A token missing the scope an operation requires
        is rejected with `403`.
