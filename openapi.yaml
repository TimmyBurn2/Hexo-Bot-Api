    identifier: MIT
  contact:
    name: HeXO community
    url: https://hexo.did.science

servers:
  - url: https://hexo.did.science
    description: HeXO server (proposed, endpoints not yet implemented).

security:
  - bearerAuth: []

tags:
  - name: Account
    description: Account identity and bot instance registration.
  - name: Stream
    description: >-
      Long-lived NDJSON streams. The global event stream never closes (and
      opening a new one closes any previous stream for the same token); the
      per-game stream closes once the game's `status` reaches `finished`. Both
      send a blank-line keepalive at least every 15 seconds.
  - name: Bot
    description: "Bot-only operations: advertising challenge availability, streaming a game, submitting moves, resigning."
  - name: Challenge
    description: Creating, accepting, declining, and canceling challenges (and bulk pairings).
  - name: Directory
    description: >-
      Browse the public bot roster to discover opponents. Read-only and
      paginated; each entry is static identity (handle, display name, owner,
      optional rating and hardware label) plus a single coarse, advisory,
      current-state `openForChallenge` flag. No response carries timestamps or
      history.

