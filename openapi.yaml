openapi: 3.1.0

info:
  title: HeXO Bot API
  version: 0.1.0-draft
  summary: "PROPOSAL: the bot protocol contract for HeXO on hexo.did.science (not yet implemented)."
  description: >-
    > **Status: WIP, not yet implemented.** Field names, shapes, and
    > paths may change before `1.0.0`. Treat this as a request-for-comment.


    The **HeXO Bot API** is the contract a bot speaks to play HeXO on
    `https://hexo.did.science`.


    ## Design in one paragraph

    The **server is the referee**: it owns legality, turn order, pairing,
    clocks, and ratings. **Bots own everything else**: their state, search, time
    management, and reconnection. The wire protocol is **stateless by design**:
    a bot rebuilds the whole board by replaying the *cumulative* move list the
    server sends, so it can crash and rejoin a live game with zero local memory.
    This contract is a **proposal layered on the existing HeXO server**: it
    mirrors or exposes concepts the server already implements rather than
    duplicating server-owned logic, and where the two differ the server is
    authoritative.


    ## Shape (modelled on the Lichess Bot/Board API)

    - **Two NDJSON streams.** A global event stream (`GET /api/stream/event`) and a per-game stream (`GET /api/bot/game/stream/{gameId}`). Long-lived `application/x-ndjson` GETs; one JSON object per line, with a blank-line keepalive at least every 15 seconds. The global stream carries the challenge lifecycle (`challenge`, `challengeDeclined`, `challengeCanceled`, `challengeExpired`) plus `gameStart`/`gameFinish`; the per-game stream carries `gameFull`, `gameState`, and an observe-only `opponentGone`. Opening a new global event stream closes any previous one for the same token.

    - **Moves POST up, state streams down.** Moves are submitted with a separate
      `POST`; the resulting state arrives on the per-game stream.


    ## Authentication

    All operations require a **Personal Access Token (PAT)**: `Authorization: Bearer hxo_...`. Tokens are long-lived and revocable. Each registered bot instance has its **own** token, so one instance can be revoked without affecting the operator's others. The scope for play is **`bot:play`**; registering instances requires **`bot:register`**; organizer operations (bulk pairing) require **`bot:organize`**. Operators register instances with a `bot:register` token; the per-instance tokens minted by registration carry only `bot:play`. A token missing the required scope → `403`.


    ## Time control

    Every game carries a time control, set on the challenge and echoed on the
    game. It is a union over `mode`:

    - `unlimited`: no time limit.
    - `turn`: a per-turn budget (`turnTimeMs`, ms); each side gets that long for
      every turn it is to move. The per-move-budget mode, fine-grained and
      sub-second capable for bots (500 ms default, 45000 ms ceiling).
    - `match`: a whole-game clock per side (`mainTimeMs` + `incrementMs`, ms).

    Under `turn` and `match`, the clock measures the whole engine, speed
    included.


    ## Hardware telemetry

    A bot may **opt in** to a coarse hardware self-report (`HardwareInfo`: GPU
    class, CPU cores, RAM GB) at registration time. It is shown as a **label
    only** and is **not used as a rating or pairing input**: the server never
    feeds it into the rating formula or pairing. Under a timed control (`turn` or
    `match`) faster hardware can still help a bot move quicker and so affect
    results; the label itself is not a measurement and carries no rating weight.
    No serials, MAC addresses, or hostnames are collected.


    ## Variant & sides

    This API currently serves a single variant, `httt6`, HeXO's hexagonal
    tic-tac-toe. The coordinate space is an unbounded integer axial hex grid,
    but a cell is legal to play only within hex-distance 8 of an already-placed
    stone, so legal placement is a bounded frontier that widens as stones are
    placed: at the opening only the centre `[0, 0]` is available. This rule is
    descriptive: the server is the sole authority and rejects an out-of-frontier
    placement with `422 out-of-bounds`, which a bot must handle but need not
    pre-validate. **The server auto-plays the opening single centre hex on
    Player 1 (`p1`)'s behalf; every submitted turn places two hexes.** Win by
    connecting six of your own hexes in a line along any of the three board axes. The two sides are identified by play order, `p1` and `p2`
    (not colours). Both constants are defined once (see the `Variant` and `Side`
    schemas) and must match the server's registry.
