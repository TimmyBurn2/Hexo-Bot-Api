components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        minimum: 1
        type: integer
  parameters:
    ChallengeId:
      description: The challenge, as carried on its challenge line.
      in: path
      name: challengeId
      required: true
      schema:
        type: string
    GameId:
      description: The game, as carried on gameStart and moveRequest.
      in: path
      name: gameId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
      description: The request fails validation.
    Banned:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BannedError"
      description: The bot's owner is banned; after the ban lifts, the owner must rotate the token.
    BotUnauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: Missing, unknown, or rotated bot token.
    GameOver:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GameOverError"
      description: The game is already finished (game_over).
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
      description: The target does not exist or is not the caller's to act on.
    Paused:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PausedError"
      description: "The site is paused: nothing new starts, while open streams and live games run on.
        Retry after 60 s."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  schemas:
    Accepts:
      description: The clocks the bot agrees to play.
      properties:
        match:
          type: boolean
        turnMs:
          description: The accepted turn time window [min, max] in milliseconds, or null for none.
          items:
            type: integer
          maxItems: 2
          minItems: 2
          type:
            - array
            - "null"
        unlimited:
          type: boolean
      required:
        - turnMs
        - match
        - unlimited
      type: object
    Account:
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      required:
        - name
        - rating
        - provisional
      type: object
    AccountDeclaration:
      additionalProperties: false
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      type: object
    BadRequestError:
      properties:
        code:
          enum:
            - bad_request
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BannedError:
      properties:
        code:
          enum:
            - banned
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BotListing:
      description: The declaration fields are absent until the bot declares them.
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        liveGames:
          description: The games the bot is playing now; at 4 it takes no new one.
          maximum: 4
          minimum: 0
          type: integer
        name:
          type: string
        online:
          description: True while the bot holds its stream open.
          type: boolean
        openForChallenges:
          description: True while the bot holds its stream open with open=1.
          type: boolean
        ownerName:
          type:
            - string
            - "null"
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      required:
        - name
        - ownerName
        - online
        - openForChallenges
        - rating
        - provisional
        - liveGames
      type: object
    Challenge:
      description: firstPlayer names who plays turn (openingPlies + 1) / 2, the first turn after the
        opening. A random firstPlayer is drawn at acceptance.
      properties:
        challengeId:
          type: string
        challenger:
          $ref: "#/components/schemas/Player"
        destUser:
          $ref: "#/components/schemas/Player"
        firstPlayer:
          enum:
            - challenger
            - challenged
            - random
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        status:
          enum:
            - created
            - accepted
            - declined
            - canceled
            - expired
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
      required:
        - challengeId
        - challenger
        - destUser
        - timeControl
        - openingPlies
        - firstPlayer
        - status
      type: object
    ChallengeAcceptError:
      properties:
        code:
          enum:
            - bad_request
            - bot_busy
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCanceledEvent:
      description: A cancel reaches the target with reason canceled; an expiry reaches both sides with
        reason expired.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        reason:
          enum:
            - canceled
            - expired
          type: string
        type:
          enum:
            - challengeCanceled
          type: string
      required:
        - type
        - reason
        - challenge
      type: object
    ChallengeCreateError:
      properties:
        code:
          enum:
            - bad_request
            - not_open
            - clock_not_accepted
            - bot_busy
            - inbox_full
            - daily_pair_cap
            - daily_bot_cap
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCreatedEvent:
      description: A pending challenge for the bot, sent on creation and replayed as the stream opens.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challenge
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeDeclinedEvent:
      description: The target declined; sent to the challenger.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challengeDeclined
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeForbiddenError:
      properties:
        code:
          enum:
            - banned
            - own_bot
            - delisted
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    EngineSession:
      properties:
        socketUrl:
          description: The engine-session websocket, origin-relative.
          type: string
        token:
          description: The game token, valid for 60 s; each gameStart line carries a fresh one.
          type: string
      required:
        - socketUrl
        - token
      type: object
    FinishReason:
      enum:
        - aborted
        - disconnect
        - surrender
        - timeout
        - terminated
        - six-in-a-row
      type: string
    GameFinishEvent:
      properties:
        gameId:
          type: string
        reason:
          $ref: "#/components/schemas/FinishReason"
        type:
          enum:
            - gameFinish
          type: string
        winner:
          description: Null after an abort, a termination, or a disconnect that left neither side connected.
          enum:
            - x
            - o
            - null
          type:
            - string
            - "null"
      required:
        - type
        - gameId
        - winner
        - reason
      type: object
    GameOverError:
      properties:
        code:
          enum:
            - game_over
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    GameStartEvent:
      description: A game the bot plays has started, or is replayed as the stream opens.
      properties:
        engine:
          $ref: "#/components/schemas/EngineSession"
        gameId:
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        opponent:
          $ref: "#/components/schemas/Seat"
        rated:
          description: False for a game against a guest, which moves no rating.
          type: boolean
        side:
          enum:
            - x
            - o
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        type:
          enum:
            - gameStart
          type: string
      required:
        - type
        - gameId
        - side
        - opponent
        - timeControl
        - openingPlies
        - rated
        - engine
      type: object
    MoveRequestEvent:
      description: Follows a replayed gameStart when it is the bot's turn; live turns arrive on the engine
        session.
      properties:
        gameId:
          type: string
        request:
          $ref: "#/components/schemas/MoveRequest"
        type:
          enum:
            - moveRequest
          type: string
      required:
        - type
        - gameId
        - request
      type: object
    NotFoundError:
      properties:
        code:
          enum:
            - not_found
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Ok:
      properties:
        ok:
          enum:
            - true
          type: boolean
      required:
        - ok
      type: object
    OpeningPlies:
      description: Stones the server places before either player acts, the origin at (0, 0) included. A
        ply is one stone; turn 0 is the origin, and turn t >= 1 is plies 2t-1 and 2t. Each later ply
        lands in order on an empty cell drawn uniformly from those within hex distance 2 of the
        origin, for the player who owns that ply. The whole opening is redrawn while any 6
        consecutive cells on an axis hold 4 or more stones of one player and none of the other. The
        draw uses a CSPRNG when the game is created, for a challenge at acceptance.
      enum:
        - 1
        - 3
        - 5
        - 7
        - 9
      type: integer
    PausedError:
      properties:
        code:
          enum:
            - paused
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Player:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - name
        - rating
        - provisional
      type: object
    Provisional:
      description: True while the rating deviation is above 75.
      type: boolean
    Rating:
      description: The Glicko-2 rating, rounded to a whole point.
      type: integer
    Seat:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          allOf:
            - $ref: "#/components/schemas/Rating"
            - type:
                - integer
                - "null"
      required:
        - name
        - rating
        - provisional
      type: object
    StreamEvent:
      discriminator:
        mapping:
          challenge: "#/components/schemas/ChallengeCreatedEvent"
          challengeCanceled: "#/components/schemas/ChallengeCanceledEvent"
          challengeDeclined: "#/components/schemas/ChallengeDeclinedEvent"
          gameFinish: "#/components/schemas/GameFinishEvent"
          gameStart: "#/components/schemas/GameStartEvent"
          moveRequest: "#/components/schemas/MoveRequestEvent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/GameStartEvent"
        - $ref: "#/components/schemas/MoveRequestEvent"
        - $ref: "#/components/schemas/GameFinishEvent"
        - $ref: "#/components/schemas/ChallengeCreatedEvent"
        - $ref: "#/components/schemas/ChallengeCanceledEvent"
        - $ref: "#/components/schemas/ChallengeDeclinedEvent"
    TimeControl:
      description: Durations are in milliseconds.
      oneOf:
        - properties:
            mode:
              enum:
                - unlimited
              type: string
          required:
            - mode
          type: object
        - properties:
            mode:
              enum:
                - turn
              type: string
            turnTimeMs:
              minimum: 5000
              type: integer
          required:
            - mode
            - turnTimeMs
          type: object
        - properties:
            incrementMs:
              minimum: 0
              type: integer
            mainTimeMs:
              minimum: 60000
              type: integer
            mode:
              enum:
                - match
              type: string
          required:
            - mode
            - mainTimeMs
            - incrementMs
          type: object
    UnauthorizedError:
      properties:
        code:
          enum:
            - unauthorized
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    # --- BEGIN vendored htttx ---
    # Verbatim from htttx-bot-api@37d2385
    # (definitions/stateless/stateless-v1-alpha.yaml). Do not edit by hand;
    # scripts/check-htttx.sh diffs this block against upstream.
    Coord:
      description: Axial hex-coordinate. +q goes right, +r goes top-right.
      type: object
      properties:
        q:
          type: integer
        r:
          type: integer
      required:
        - q
        - r

    Board:
      description: Current board state.
      type: object
      properties:
        to_move:
          type: string
          enum: ["x", "o"]
        cells:
          type: array
          items:
            type: object
            properties:
              q:
                type: integer
              r:
                type: integer
              p:
                description: Piece on the coordinate
                type: string
                enum: ["x", "o"]
            required:
              - q
              - r
              - p
      required:
        - to_move
        - cells

    PositionEvaluation:
      description: Optional evaluation of the position by the bot. Can include any additional fields not defined by this API.
      type: object
      properties:
        heuristic:
          description: |
            Heuristical evaluation of the position. Can be any real number.
            Positive numbers show advantage for crosses. Negative show advantage for circles.
            Default scale for this value should be between -1 and 1, that's what the client UI will assume as the range
            of the values, but the bot is not required to clamp them, and the client must support bots which return
            arbitrarily small or large values.
          type: number
        win_in:
          description: |
            Should be used when the bot found (or assumes there to be) a win for one of the sides in N turns.
            If the win is found for crosses, N should be positive. If it is found for circles, N should be negated.
            A turn is two placements. For example position oooo.oooo, cross to move,
            would have a "win_in" value of -2. Turn 1 would be cross's turn, and turn 2 is the winning turn of circles.
          type: integer

    Move:
      description: |
        A single move of two placements.

        The move must be legal; the platform detects an illegal move from the response
        against the board and the turn. A move is illegal if it has:
          - the wrong number of placements for the turn;
          - a placement on an occupied cell;
          - a placement out of range (after the origin, beyond the placement radius of
            every placed cell);
          - a first placement not at the origin (0, 0);
          - a placement for the wrong side or out of turn;
          - a placement after the game is won.

        On an illegal move a server MAY reject it and SHOULD NOT apply it. This API does
        not define any further consequence (result, winner, finishReason); that is
        owned by the play layer.
      type: object
      properties:
        pieces:
          type: array
          items:
            $ref: "#/components/schemas/Coord"
          minItems: 2
          maxItems: 2
        evaluation:
          $ref: "#/components/schemas/PositionEvaluation"
      required:
        - pieces
      examples:
        - pieces:
            - q: 1
              r: 0
            - q: -1
              r: 1

    MoveRequest:
      description: A request for the bot to evaluate the position and make a move.
      type: object
      properties:
        board:
          $ref: "#/components/schemas/Board"
        time_limit:
          description: |
            Seconds given to the bot to make a move, if the bot respects the limit,
            then the "stateless.v1-alpha.move_time_limit" property of the bot's capabilities.json should be set to true.

            Even if the bot supports this capability, the client is not required to provide this field. 
            In this case, it is assumed that the thinking time is unlimited.
          type: number
          minimum: 0
        request_id:
          description: |
            Optional identifier of this request, echoed unchanged on the response. The
            http request/response pair already correlates the answer and each request
            carries the full board, so request_id is not required. If the bot sets
            "stateless.v1-alpha.request_id" it echoes this value when supplied, so the
            client can double-check the pairing.
          type: integer
          minimum: 0
      required:
        - board
      examples:
        - board:
            to_move: "o"
            cells:
              - q: 0
                r: 0
                p: "x"
          time_limit: 5
          request_id: 1
    
    MoveResponse:
      description: Moves made
      type: object
      properties:
        move:
          description: Top move chosen by the bot.
          $ref: "#/components/schemas/Move"
        considerations:
          description: Optional, additional moves the bot has considered, ordered by best to worst.
          type: array
          items:
            $ref: "#/components/schemas/Move"
        request_id:
          description: |
            The request_id of the move request, echoed unchanged when the request
            carried one (see "stateless.v1-alpha.request_id").
          type: integer
          minimum: 0
      required:
        - move
      examples:
        - move:
            pieces:
              - q: 1
                r: 0
              - q: -1
                r: 1
          request_id: 1
    # --- END vendored htttx ---
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      description: A bot token (hxo_...), minted and rotated by the owner on the website.
      scheme: bearer
      type: http
    gameToken:
      bearerFormat: opaque
      description: A game token (hgs_...) from a gameStart line.
      scheme: bearer
      type: http
info:
  description: >-
    A bot authenticates with its token, holds one NDJSON stream open, and plays each game on the
    engine session that gameStart hands out. The server is the referee: it owns pairing, clocks,
    ratings, and the game lifecycle.


    The board exchange (Coord, Board, PositionEvaluation, Move, MoveRequest, MoveResponse) is the
    htttx stateless v1-alpha schema set, vendored verbatim from
    [htttx-bot-api](https://github.com/hex-tic-tac-toe/htttx-bot-api) at commit `37d2385`. The
    engine session speaks htttx basic_websocket (bws-v1-alpha) at the same commit. Coordinates are
    axial q,r: +q right, +r top-right.
  license:
    identifier: MIT
    name: MIT
  title: HeXO Bot API
  version: 0.6.0
openapi: 3.1.0
paths:
  /api/bot/account:
    get:
      description: The bot's name, rating, and stored declaration.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
      security:
        - bearerAuth: []
      summary: Read the bot's own account.
      tags:
        - Account
    patch:
      description: Each present field replaces the stored one; an empty string clears a text field, and
        accepts is replaced whole. An unknown key answers 400. A challenge or game outside accepts
        answers clock_not_accepted.
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeclaration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account after the update.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
      security:
        - bearerAuth: []
      summary: Declare the bot's about, version, repo, and what it accepts.
      tags:
        - Account
  /api/bot/challenge/{challengeId}/accept:
    post:
      description: Only the challenged bot may accept. The game starts at once, and both bots receive gameStart.
      operationId: acceptChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptError"
          description: The challenged bot is at its game cap (bot_busy); the challenge stays pending.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Accept a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/cancel:
    post:
      description: Only the challenger may cancel; the target receives challengeCanceled.
      operationId: cancelChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Canceled.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
      summary: Cancel a challenge the caller issued.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/decline:
    post:
      description: Only the challenged bot may decline; the challenger receives challengeDeclined.
      operationId: declineChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Declined.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
      summary: Decline a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{name}:
    post:
      description: The target must hold its stream open with open=1 and accept the clock. A bot plays at
        most 4 games at once. Per UTC day, a bot plays at most 100 bot-vs-bot games, and a pair 20.
        The target holds at most 10 pending challenges. A challenge expires after 60 s. Resending a
        requestId answers 200 with the stored challenge.
      operationId: createChallenge
      parameters:
        - description: The challenged bot's name.
          in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                firstPlayer:
                  default: random
                  enum:
                    - challenger
                    - challenged
                    - random
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 5
                requestId:
                  maxLength: 128
                  minLength: 1
                  type: string
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - timeControl
                - requestId
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The stored challenge for a known requestId, with the status it reached.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The challenge, pending in the target's inbox.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreateError"
          description: Validation failed (bad_request), the target is not open (not_open) or excludes the
            clock (clock_not_accepted), a side is at its game cap (bot_busy), the target's inbox is
            full (inbox_full), or the pair (daily_pair_cap) or a bot (daily_bot_cap) is at its daily
            cap.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeForbiddenError"
          description: The challenger's owner owns the target (own_bot), either bot is delisted (delisted), or
            the challenger's owner is banned (banned).
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Challenge another bot.
      tags:
        - Challenge
  /api/bot/game/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender; no engine session is needed.
      operationId: resignBotGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Resigned.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Missing, unknown, expired, or rotated game token.
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - gameToken: []
      summary: Resign a game over the engine-session token.
      tags:
        - Engine session
  /api/bot/game/{gameId}/socket:
    get:
      description: Speaks htttx basic_websocket v1-alpha, the server as client and the bot as bot. The bot
        must support the move_skips and request_id capabilities. A new connection replaces the
        previous one. Each move_request lists in previous only the turns this connection has not
        seen. Heartbeats come every 10 s. A move_response must echo request_id, or it is dropped. An
        illegal move forfeits.
      operationId: openEngineSession
      parameters:
        - $ref: "#/components/parameters/GameId"
        - description: The game token from the gameStart line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching protocols; the engine session is open.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
          description: Unknown game, or a game token that is expired or rotated.
      security: []
      summary: Open the per-game engine session.
      tags:
        - Engine session
  /api/bot/stream:
    get:
      description: One StreamEvent per line, with a bare newline as keepalive every 10 s. Opening a stream
        closes the bot's previous one. The bot is online while its stream is open. On open, each
        active game replays as gameStart, followed by moveRequest on the bot's turn. Play runs on
        the engine session that gameStart hands out.
      operationId: openStream
      parameters:
        - description: Present as 1, the bot takes challenges and games while the stream is open.
          in: query
          name: open
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/StreamEvent"
          description: The event stream, as NDJSON.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Open the bot's event stream.
      tags:
        - Stream
  /api/bots:
    get:
      description: The listed roster, ordered by name fold, without pagination. Delisted bots and bots of
        banned owners are hidden.
      operationId: listBots
      parameters:
        - description: Present as 1, narrows the roster to bots holding a stream open.
          in: query
          name: online
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BotListing"
                type: array
          description: The roster.
        "400":
          $ref: "#/components/responses/BadRequest"
      security: []
      summary: List public bots.
      tags:
        - Directory
servers:
  - description: The origin of whichever deployment serves this contract.
    url: /
tags:
  - description: The public bot roster.
    name: Directory
  - description: The one NDJSON event stream a bot holds open, and its availability.
    name: Stream
  - description: The bot's identity, rating, and declaration.
    name: Account
  - description: The per-game websocket a bot plays on, and resigning.
    name: Engine session
  - description: Creating, accepting, declining, and canceling challenges.
    name: Challenge
webhooks: {}
