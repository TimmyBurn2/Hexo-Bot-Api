components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        minimum: 1
        type: integer
  parameters:
    ChallengeId:
      description: The challenge, as carried on its challenge line.
      in: path
      name: challengeId
      required: true
      schema:
        type: string
    GameId:
      description: The game, as carried on gameStart and moveRequest.
      in: path
      name: gameId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
      description: The request fails validation.
    Banned:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BannedError"
      description: The bot's owner is banned; after the ban lifts, the owner must rotate the token.
    BotUnauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
      description: Missing, unknown, or rotated bot token.
    GameOver:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GameOverError"
      description: The game is already finished (game_over).
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
      description: The target does not exist or is not the caller's to act on.
    Paused:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PausedError"
      description: "The site is paused: no new stream, challenge, or game starts, and open streams and
        live games continue. A bot with a live game, or playing the running weekly tournament, still
        opens its stream. Retry after Retry-After."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PayloadTooLargeError"
      description: The body is larger than 16 KiB (payload_too_large).
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
      description: "Too many requests (rate_limited). Per network address: 60 at once, then 10 a second.
        Per bot token, and per game token: 20 at once, then 2 a second. Without a credential, across
        all callers: 300 at once, then 100 a second. Retry after Retry-After."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  schemas:
    Accepts:
      description: The clocks the bot plays; a bot that never declared accepts plays none.
      properties:
        match:
          description: True to play any match clock.
          type: boolean
        turnMs:
          description: The turn clocks the bot plays, as the inclusive [min, max] of turnTimeMs; null refuses
            turn clocks.
          items:
            type: integer
          maxItems: 2
          minItems: 2
          type:
            - array
            - "null"
        unlimited:
          description: True to play games with no clock.
          type: boolean
      required:
        - turnMs
        - match
        - unlimited
      type: object
    Account:
      description: levels and analyzer are null until the bot declares them.
      properties:
        about:
          description: The owner's text from the website, which the bot's pages show; else the declared one.
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        analyzer:
          $ref: "#/components/schemas/Analyzer"
        levels:
          $ref: "#/components/schemas/Levels"
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
          description: The owner's link from the website, which the bot's pages show; else the declared one.
        version:
          maxLength: 64
          type: string
      required:
        - name
        - rating
        - provisional
        - levels
        - analyzer
      type: object
    AccountDeclaration:
      additionalProperties: false
      description: "Text is cleaned, never refused for what it holds: a line break or tab becomes a space,
        other control and format characters (bidirectional marks, zero-width characters, soft
        hyphens) are dropped, whitespace runs collapse, and the ends are trimmed. A level's about
        and note are cleaned the same way."
      properties:
        about:
          deprecated: true
          description: "Deprecated: the owner sets the bot's text on the website, which takes this one's
            place. At most 280 characters once cleaned; empty clears it."
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        analyzer:
          $ref: "#/components/schemas/AnalyzerDeclaration"
        levels:
          $ref: "#/components/schemas/Levels"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
          deprecated: true
          description: "Deprecated: the owner sets the bot's link on the website, which takes this one's
            place. Empty clears it."
        version:
          description: At most 64 characters once cleaned; empty clears it.
          type: string
      type: object
    AnalysisSession:
      properties:
        socketUrl:
          description: The analysis session's path on the API's origin, dialed as a game's engine session is.
          type: string
        token:
          description: "The analysis token (has_...): it opens the bot's analysis session until 60 s after the
            line that carried it; a later analysisSession line replaces it."
          type: string
      required:
        - socketUrl
        - token
      type: object
    AnalysisSessionEvent:
      description: "Sent only to a bot that declares an analyzer: as the stream opens, after a declaration
        turns it on, and 5 s after its analysis session closes while the stream stays open."
      properties:
        engine:
          $ref: "#/components/schemas/AnalysisSession"
        type:
          enum:
            - analysisSession
          type: string
      required:
        - type
        - engine
      type: object
    Analyzer:
      description: The analyzer the bot declared; null until it declares one, and once it withdraws.
      properties:
        lines:
          maximum: 3
          minimum: 1
          type: integer
        maxSeconds:
          maximum: 10
          minimum: 1
          type: integer
        ready:
          description: True while the bot holds its analysis session open.
          type: boolean
        values:
          $ref: "#/components/schemas/AnalyzerValues"
        whilePlaying:
          type: boolean
      required:
        - maxSeconds
        - lines
        - whilePlaying
        - values
        - ready
      type:
        - object
        - "null"
    AnalyzerDeclaration:
      additionalProperties: false
      description: Opts the bot in to reading positions sent on its analysis session, from the website's
        analysis board and from finished games. Declaring it promises the htttx basic_websocket
        capabilities free_setup, resettable_state, dual_sided, request_id, move_time_limit, and
        interruptible.
      properties:
        lines:
          description: "Lines the bot answers per position: its move, then up to two considerations, each with
            an evaluation."
          maximum: 3
          minimum: 1
          type: integer
        maxSeconds:
          default: 2
          description: The most seconds the bot reads one position for; a person picks up to it. 2 when absent.
          maximum: 10
          minimum: 1
          type: integer
        values:
          $ref: "#/components/schemas/AnalyzerValuesDeclaration"
        whilePlaying:
          default: false
          description: True to take positions while the bot plays a game; false, the default, takes them only
            between games.
          type: boolean
      required:
        - lines
      type:
        - object
        - "null"
    AnalyzerValues:
      description: "How the analyzer's heuristic reads: scale 1, null cuts, which judge no drop of value,
        and raw, unless it declared otherwise."
      properties:
        cuts:
          $ref: "#/components/schemas/ValueCuts"
        meaning:
          $ref: "#/components/schemas/ValueMeaning"
        scale:
          exclusiveMinimum: 0
          maximum: 1000000
          type: number
      required:
        - scale
        - cuts
        - meaning
      type: object
    AnalyzerValuesDeclaration:
      additionalProperties: false
      description: How the bot's heuristic reads. Absent, the heuristic reads as raw at scale 1 and no
        drop of value is judged; forced wins are judged either way.
      properties:
        cuts:
          additionalProperties: false
          description: "The drops of the mover's value, on the scaled range, the site judges a turn by: each
            above 0 and at most 2, rising from inaccuracy to blunder; 0.1, 0.2, and 0.3 suit
            expected values. Absent, it judges no drop of value."
          properties:
            blunder:
              exclusiveMinimum: 0
              maximum: 2
              type: number
            inaccuracy:
              exclusiveMinimum: 0
              maximum: 2
              type: number
            mistake:
              exclusiveMinimum: 0
              maximum: 2
              type: number
          required:
            - inaccuracy
            - mistake
            - blunder
          type: object
        meaning:
          default: raw
          description: "expected: the heuristic, divided by scale, is the bot's estimate of x's expected
            result, 2 P(x wins) - 1. raw, the default: it is only ordered, higher being better for
            x, and not calibrated."
          enum:
            - expected
            - raw
          type: string
        scale:
          default: 1
          description: The heuristic size the bot means as decided; the site divides heuristics by it before
            drawing or judging them. 1 when absent.
          exclusiveMinimum: 0
          maximum: 1000000
          type: number
      type: object
    BadRequestError:
      properties:
        code:
          enum:
            - bad_request
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BannedError:
      properties:
        code:
          enum:
            - banned
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    BotListing:
      description: The declaration fields are absent until the bot declares them, and levels and analyzer
        are null; about and repoUrl are the owner's from the website where set, else the declared
        ones.
      properties:
        about:
          maxLength: 280
          type: string
        accepts:
          $ref: "#/components/schemas/Accepts"
        analyzer:
          $ref: "#/components/schemas/Analyzer"
        levels:
          $ref: "#/components/schemas/Levels"
        liveGames:
          description: The games the bot is playing now; at 4 it takes no new one.
          maximum: 4
          minimum: 0
          type: integer
        name:
          type: string
        online:
          description: True while the bot holds its stream open.
          type: boolean
        openForChallenges:
          description: True while the bot holds its stream open with open=1.
          type: boolean
        ownerName:
          type:
            - string
            - "null"
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
        repoUrl:
          anyOf:
            - format: uri
              maxLength: 2048
              type: string
            - enum:
                - ""
              type: string
        version:
          maxLength: 64
          type: string
      required:
        - name
        - ownerName
        - online
        - openForChallenges
        - rating
        - provisional
        - liveGames
        - levels
        - analyzer
      type: object
    Challenge:
      description: firstPlayer picks who moves first after the opening, on turn (openingPlies + 1) / 2. o
        plays the odd turns, so after 1, 5, or 9 opening plies the first player is o, and after 3 or
        7 it is x. random is drawn at acceptance; gameStart.side gives each bot its side.
      properties:
        challengeId:
          type: string
        challenger:
          $ref: "#/components/schemas/Player"
        destUser:
          $ref: "#/components/schemas/Player"
        firstPlayer:
          enum:
            - challenger
            - challenged
            - random
          type: string
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        status:
          enum:
            - created
            - accepted
            - declined
            - canceled
            - expired
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
      required:
        - challengeId
        - challenger
        - destUser
        - timeControl
        - openingPlies
        - firstPlayer
        - status
      type: object
    ChallengeAcceptError:
      properties:
        code:
          enum:
            - bad_request
            - bot_busy
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCanceledEvent:
      description: A cancel reaches the target with reason canceled; an expiry reaches both sides with
        reason expired.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        reason:
          enum:
            - canceled
            - expired
          type: string
        type:
          enum:
            - challengeCanceled
          type: string
      required:
        - type
        - reason
        - challenge
      type: object
    ChallengeCreateError:
      properties:
        code:
          enum:
            - bad_request
            - not_open
            - clock_not_accepted
            - bot_busy
            - inbox_full
            - challenge_pending
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeCreatedEvent:
      description: A pending challenge for the bot, sent on creation and replayed as the stream opens.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challenge
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeDeclinedEvent:
      description: The target declined; sent to the challenger.
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        type:
          enum:
            - challengeDeclined
          type: string
      required:
        - type
        - challenge
      type: object
    ChallengeForbiddenError:
      properties:
        code:
          enum:
            - banned
            - own_bot
            - delisted
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ChallengeQuotaError:
      properties:
        code:
          enum:
            - daily_challenge_cap
            - daily_pair_cap
            - daily_bot_cap
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    EngineSession:
      properties:
        socketUrl:
          description: A path on the API's origin; dial it as wss://, or ws:// where the API is http://.
          type: string
        token:
          description: "The game token (hgs_...): it opens this game's engine session and resigns the game
            until 60 s after this gameStart; reopening the stream replays gameStart with a fresh
            one."
          type: string
      required:
        - socketUrl
        - token
      type: object
    FinishReason:
      description: "How a game ended. six-in-a-row: the winner completed six in a row. timeout: the
        loser's clock ran out. surrender: the loser resigned. disconnect: the loser's stream stayed
        closed for 30 s. terminated: the loser played an illegal move, or, with no winner, the game
        reached 500 turns or 24 hours. aborted: the operator, a restart, or the end of a human
        player's session stopped the game, with no winner."
      enum:
        - aborted
        - disconnect
        - surrender
        - timeout
        - terminated
        - six-in-a-row
      type: string
    GameFinishEvent:
      properties:
        gameId:
          type: string
        reason:
          $ref: "#/components/schemas/FinishReason"
        type:
          enum:
            - gameFinish
          type: string
        winner:
          description: Null after aborted, and after terminated at the turn or time cap.
          enum:
            - x
            - o
            - null
          type:
            - string
            - "null"
      required:
        - type
        - gameId
        - winner
        - reason
      type: object
    GameOverError:
      properties:
        code:
          enum:
            - game_over
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    GameStartEvent:
      description: A game the bot plays has started, or is replayed as the stream opens. A game started by
        a player on the website or by a tournament arrives with no challenge before it.
      properties:
        engine:
          $ref: "#/components/schemas/EngineSession"
        gameId:
          type: string
        level:
          description: The declared level the bot plays this game at, by id; null at its default. A bot that
            no longer declares the level plays its default.
          pattern: ^[a-z0-9-]{1,16}$
          type:
            - string
            - "null"
        openingPlies:
          $ref: "#/components/schemas/OpeningPlies"
        opponent:
          $ref: "#/components/schemas/Seat"
        rated:
          description: "Whether this game moves the bot's own rating: true only in a rated game between two
            bots. A game against a player moves only the player's rating, and one against a guest
            moves none. A game between two bots is unrated at a level other than a bot's default, in
            a duel or round robin a person set up on the website, and between two bots of one
            owner."
          type: boolean
        side:
          enum:
            - x
            - o
          type: string
        timeControl:
          $ref: "#/components/schemas/TimeControl"
        type:
          enum:
            - gameStart
          type: string
      required:
        - type
        - gameId
        - side
        - opponent
        - timeControl
        - openingPlies
        - rated
        - level
        - engine
      type: object
    Level:
      additionalProperties: false
      properties:
        about:
          description: At most 120 characters once cleaned.
          type: string
        budget:
          $ref: "#/components/schemas/LevelBudget"
        id:
          $ref: "#/components/schemas/LevelId"
        label:
          description: The name a player picks the level by, 24 printable ASCII characters at most, starting
            and ending on a visible one.
          pattern: ^[!-~](?:[ -~]{0,22}[!-~])?$
          type: string
        note:
          description: Anything about the level the budget keys cannot say, at most 80 characters once cleaned.
          type: string
      required:
        - id
        - label
      type: object
    LevelBudget:
      additionalProperties: false
      description: What a level spends per turn, as the bot states it, for display only; at least one key.
      minProperties: 1
      properties:
        depthTurns:
          description: Search depth in HeXO turns, not stones.
          maximum: 64
          minimum: 1
          type: integer
        nodes:
          description: Search nodes per turn.
          maximum: 1000000000000
          minimum: 1
          type: integer
        playouts:
          description: Simulations or visits per turn.
          maximum: 1000000000
          minimum: 1
          type: integer
        timeMs:
          description: Think time per turn, in milliseconds.
          maximum: 600000
          minimum: 1
          type: integer
      type: object
    LevelId:
      description: "A level's id: lowercase letters, digits, and hyphens, unique in the bot's list."
      pattern: ^[a-z0-9-]{1,16}$
      type: string
    Levels:
      additionalProperties: false
      description: The strengths a player on the website may pick, 2 to 8, weakest first, each id unique;
        default names one of them. A game at any level but the default is unrated for both sides.
        Null until the bot declares levels, and once it clears them.
      properties:
        default:
          description: "The level the bot plays unless a player picks another: the one its rating belongs to."
          pattern: ^[a-z0-9-]{1,16}$
          type: string
        list:
          description: Weakest first.
          items:
            $ref: "#/components/schemas/Level"
          maxItems: 8
          minItems: 2
          type: array
      required:
        - default
        - list
      type:
        - object
        - "null"
    MoveRequestEvent:
      deprecated: true
      description: "Deprecated, and sent until the API's 1.0.0: it follows a replayed gameStart when the
        bot is to move, for information, and needs no answer, since the engine session sends its own
        move_request."
      properties:
        gameId:
          type: string
        request:
          $ref: "#/components/schemas/MoveRequest"
        type:
          enum:
            - moveRequest
          type: string
      required:
        - type
        - gameId
        - request
      type: object
    NotFoundError:
      properties:
        code:
          enum:
            - not_found
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Ok:
      properties:
        ok:
          enum:
            - true
          type: boolean
      required:
        - ok
      type: object
    OpeningPlies:
      description: Stones the server places before either player acts, the origin at (0, 0) included. A
        ply is one stone; turn 0 is the origin, and turn t >= 1 is plies 2t-1 and 2t. Each later ply
        lands on an empty cell drawn uniformly from those within hex distance 2 of the origin. The
        whole opening is redrawn while any 6 consecutive cells on an axis hold 4 or more stones of
        one player and none of the other.
      enum:
        - 1
        - 3
        - 5
        - 7
        - 9
      type: integer
    PausedError:
      properties:
        code:
          enum:
            - paused
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    PayloadTooLargeError:
      properties:
        code:
          enum:
            - payload_too_large
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Player:
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          $ref: "#/components/schemas/Rating"
      required:
        - name
        - rating
        - provisional
      type: object
    Provisional:
      description: True while the rating deviation is above 75.
      type: boolean
    RateLimitedError:
      properties:
        code:
          enum:
            - rate_limited
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    Rating:
      description: The Glicko-2 rating, rounded to a whole point.
      type: integer
    Seat:
      description: "A seat in a game: a bot, a player, or a guest, whose rating is null."
      properties:
        name:
          type: string
        provisional:
          $ref: "#/components/schemas/Provisional"
        rating:
          type:
            - integer
            - "null"
      required:
        - name
        - rating
        - provisional
      type: object
    StreamEvent:
      discriminator:
        mapping:
          analysisSession: "#/components/schemas/AnalysisSessionEvent"
          challenge: "#/components/schemas/ChallengeCreatedEvent"
          challengeCanceled: "#/components/schemas/ChallengeCanceledEvent"
          challengeDeclined: "#/components/schemas/ChallengeDeclinedEvent"
          gameFinish: "#/components/schemas/GameFinishEvent"
          gameStart: "#/components/schemas/GameStartEvent"
          moveRequest: "#/components/schemas/MoveRequestEvent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/GameStartEvent"
        - $ref: "#/components/schemas/MoveRequestEvent"
        - $ref: "#/components/schemas/GameFinishEvent"
        - $ref: "#/components/schemas/ChallengeCreatedEvent"
        - $ref: "#/components/schemas/ChallengeCanceledEvent"
        - $ref: "#/components/schemas/ChallengeDeclinedEvent"
        - $ref: "#/components/schemas/AnalysisSessionEvent"
    TimeControl:
      description: turn gives each turn turnTimeMs, and unused time is lost; match gives each side
        mainTimeMs for the game, adding incrementMs after each of its turns; unlimited has no clock.
        Each move_request carries the seconds left for that move.
      oneOf:
        - properties:
            mode:
              enum:
                - unlimited
              type: string
          required:
            - mode
          type: object
        - properties:
            mode:
              enum:
                - turn
              type: string
            turnTimeMs:
              minimum: 5000
              type: integer
          required:
            - mode
            - turnTimeMs
          type: object
        - properties:
            incrementMs:
              minimum: 0
              type: integer
            mainTimeMs:
              minimum: 60000
              type: integer
            mode:
              enum:
                - match
              type: string
          required:
            - mode
            - mainTimeMs
            - incrementMs
          type: object
    UnauthorizedError:
      properties:
        code:
          enum:
            - unauthorized
          type: string
        error:
          type: string
      required:
        - error
        - code
      type: object
    ValueCuts:
      additionalProperties: false
      description: Drops of the mover's value, on the scaled range, each above 0 and at most 2, rising
        from inaccuracy to blunder; 0.1, 0.2, and 0.3 suit expected values.
      properties:
        blunder:
          exclusiveMinimum: 0
          maximum: 2
          type: number
        inaccuracy:
          exclusiveMinimum: 0
          maximum: 2
          type: number
        mistake:
          exclusiveMinimum: 0
          maximum: 2
          type: number
      required:
        - inaccuracy
        - mistake
        - blunder
      type:
        - object
        - "null"
    ValueMeaning:
      description: "What the heuristic, divided by scale, means: expected is the analyzer's estimate of
        x's expected result, 2 P(x wins) - 1; raw is only ordered, higher being better for x, and
        not calibrated."
      enum:
        - expected
        - raw
      type: string
    # --- BEGIN vendored htttx ---
    # Verbatim from htttx-bot-api@37d2385
    # (definitions/stateless/stateless-v1-alpha.yaml). Do not edit by hand;
    # scripts/check-htttx.sh diffs this block against upstream.
    Coord:
      description: Axial hex-coordinate. +q goes right, +r goes top-right.
      type: object
      properties:
        q:
          type: integer
        r:
          type: integer
      required:
        - q
        - r

    Board:
      description: Current board state.
      type: object
      properties:
        to_move:
          type: string
          enum: ["x", "o"]
        cells:
          type: array
          items:
            type: object
            properties:
              q:
                type: integer
              r:
                type: integer
              p:
                description: Piece on the coordinate
                type: string
                enum: ["x", "o"]
            required:
              - q
              - r
              - p
      required:
        - to_move
        - cells

    PositionEvaluation:
      description: Optional evaluation of the position by the bot. Can include any additional fields not defined by this API.
      type: object
      properties:
        heuristic:
          description: |
            Heuristical evaluation of the position. Can be any real number.
            Positive numbers show advantage for crosses. Negative show advantage for circles.
            Default scale for this value should be between -1 and 1, that's what the client UI will assume as the range
            of the values, but the bot is not required to clamp them, and the client must support bots which return
            arbitrarily small or large values.
          type: number
        win_in:
          description: |
            Should be used when the bot found (or assumes there to be) a win for one of the sides in N turns.
            If the win is found for crosses, N should be positive. If it is found for circles, N should be negated.
            A turn is two placements. For example position oooo.oooo, cross to move,
            would have a "win_in" value of -2. Turn 1 would be cross's turn, and turn 2 is the winning turn of circles.
          type: integer

    Move:
      description: |
        A single move of two placements.

        The move must be legal; the platform detects an illegal move from the response
        against the board and the turn. A move is illegal if it has:
          - the wrong number of placements for the turn;
          - a placement on an occupied cell;
          - a placement out of range (after the origin, beyond the placement radius of
            every placed cell);
          - a first placement not at the origin (0, 0);
          - a placement for the wrong side or out of turn;
          - a placement after the game is won.

        On an illegal move a server MAY reject it and SHOULD NOT apply it. This API does
        not define any further consequence (result, winner, finishReason); that is
        owned by the play layer.
      type: object
      properties:
        pieces:
          type: array
          items:
            $ref: "#/components/schemas/Coord"
          minItems: 2
          maxItems: 2
        evaluation:
          $ref: "#/components/schemas/PositionEvaluation"
      required:
        - pieces
      examples:
        - pieces:
            - q: 1
              r: 0
            - q: -1
              r: 1

    MoveRequest:
      description: A request for the bot to evaluate the position and make a move.
      type: object
      properties:
        board:
          $ref: "#/components/schemas/Board"
        time_limit:
          description: |
            Seconds given to the bot to make a move, if the bot respects the limit,
            then the "stateless.v1-alpha.move_time_limit" property of the bot's capabilities.json should be set to true.

            Even if the bot supports this capability, the client is not required to provide this field. 
            In this case, it is assumed that the thinking time is unlimited.
          type: number
          minimum: 0
        request_id:
          description: |
            Optional identifier of this request, echoed unchanged on the response. The
            http request/response pair already correlates the answer and each request
            carries the full board, so request_id is not required. If the bot sets
            "stateless.v1-alpha.request_id" it echoes this value when supplied, so the
            client can double-check the pairing.
          type: integer
          minimum: 0
      required:
        - board
      examples:
        - board:
            to_move: "o"
            cells:
              - q: 0
                r: 0
                p: "x"
          time_limit: 5
          request_id: 1
    
    MoveResponse:
      description: Moves made
      type: object
      properties:
        move:
          description: Top move chosen by the bot.
          $ref: "#/components/schemas/Move"
        considerations:
          description: Optional, additional moves the bot has considered, ordered by best to worst.
          type: array
          items:
            $ref: "#/components/schemas/Move"
        request_id:
          description: |
            The request_id of the move request, echoed unchanged when the request
            carried one (see "stateless.v1-alpha.request_id").
          type: integer
          minimum: 0
      required:
        - move
      examples:
        - move:
            pieces:
              - q: 1
                r: 0
              - q: -1
                r: 1
          request_id: 1
    # --- END vendored htttx ---
  securitySchemes:
    bearerAuth:
      bearerFormat: opaque
      description: A bot token (hxo_...), minted and rotated by the owner on the website.
      scheme: bearer
      type: http
    gameToken:
      bearerFormat: opaque
      description: A game token (hgs_...) from a gameStart line.
      scheme: bearer
      type: http
info:
  description: >-
    A bot authenticates with its token, holds one NDJSON stream open, and plays each game on the
    engine session that gameStart hands out. A bot that declares an analyzer also reads positions on
    the analysis session that analysisSession hands out.


    Coord, Board, PositionEvaluation, Move, MoveRequest, and MoveResponse are vendored verbatim from
    [htttx-bot-api](https://github.com/hex-tic-tac-toe/htttx-bot-api) at commit `37d2385`, whose
    basic_websocket v1-alpha the engine session speaks. Coordinates are axial q,r: +q right, +r
    top-right.
  license:
    identifier: MIT
    name: MIT
  title: HeXO Bot API
  version: 0.12.1
openapi: 3.1.0
paths:
  /api/bot/account:
    get:
      description: The bot's name, rating, and stored declaration; about and repoUrl read as the bot's
        pages show them.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Read the bot's own account.
      tags:
        - Account
    patch:
      description: Each present field replaces the stored one; an empty string clears a text field,
        accepts, levels, and analyzer are replaced whole, and null clears levels or withdraws the
        analyzer. An unknown key answers 400. A challenge or game outside accepts answers
        clock_not_accepted. Levels picked on the website reach the bot as gameStart.level;
        challenges and the weekly tournament play the default.
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeclaration"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: The account after the update.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Declare what the bot accepts, its version, its levels, and its analyzer.
      tags:
        - Account
  /api/bot/analysis/socket:
    get:
      description: "Speaks htttx basic_websocket v1-alpha, the server as client, one position at a time:
        setup with the position's stones, then move_request with previous empty, side,
        move_time_limit, and request_id. The bot answers move_response with move.evaluation and
        considerations up to its declared lines, best first. interrupt drops the outstanding request
        unanswered. Analysis never counts toward the game cap."
      operationId: openAnalysisSession
      parameters:
        - description: The analysis token from the analysisSession line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: "Switching protocols; the analysis session is open, and a new connection replaces the
            previous one. A bot with a live game is sent nothing unless it declared whilePlaying,
            and a game's move request never waits on a reading. An evaluation is of the board after
            its line: win_in counts turns from that board, its side to move first; a line that
            completes six is valued for its mover, as win_in 1 with the mover's sign or a heuristic
            in its favor. A reading fails when the answer comes more than 3 s past move_time_limit,
            a line is no legal turn from the position or repeats one, the move carries no
            evaluation, or an evaluation contradicts the board or passes a win_in of 1000 or a
            heuristic of 1000000 either way. 3 failures within 10 minutes bench the analyzer for 10
            minutes. heartbeat, frame sizes, stray frames, and closes are as on the engine session;
            withdrawing the declaration closes the session."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Missing, unknown, expired, or replaced analysis token.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
          description: The bot no longer declares an analyzer.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A bot dials its analysis session at most 5 at once, then 1 every 10 s (rate_limited),
            or too many requests; a refused dial leaves an open session alone.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security: []
      summary: Open the analysis session.
      tags:
        - Analysis session
  /api/bot/challenge/{challengeId}/accept:
    post:
      description: Only the challenged bot may accept. The game starts at once, and both bots receive gameStart.
      operationId: acceptChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Accepted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeAcceptError"
          description: The challenged bot is at its game cap, or a side is playing the weekly tournament
            (bot_busy); the challenge stays pending.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Accept a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/cancel:
    post:
      description: Only the challenger may cancel; the target receives challengeCanceled.
      operationId: cancelChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Canceled.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Cancel a challenge the caller issued.
      tags:
        - Challenge
  /api/bot/challenge/{challengeId}/decline:
    post:
      description: Only the challenged bot may decline; the challenger receives challengeDeclined.
      operationId: declineChallenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Declined.
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - bearerAuth: []
      summary: Decline a challenge as the challenged bot.
      tags:
        - Challenge
  /api/bot/challenge/{name}:
    post:
      description: The target must hold its stream open with open=1 and accept the clock. A bot plays at
        most 4 games at once. The target holds at most 10 pending challenges, 1 from each
        challenger. A challenge expires after 60 s. Resending a requestId answers 200 with the
        stored challenge. Two bots of one owner play each other unrated.
      operationId: createChallenge
      parameters:
        - description: The challenged bot's name.
          in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                firstPlayer:
                  default: random
                  enum:
                    - challenger
                    - challenged
                    - random
                  type: string
                openingPlies:
                  allOf:
                    - $ref: "#/components/schemas/OpeningPlies"
                    - default: 5
                requestId:
                  maxLength: 128
                  minLength: 1
                  type: string
                timeControl:
                  $ref: "#/components/schemas/TimeControl"
              required:
                - timeControl
                - requestId
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The stored challenge for a known requestId, with the status it reached.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
          description: The challenge, pending in the target's inbox.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCreateError"
          description: Validation failed or the bot challenged itself (bad_request), the target is not open
            (not_open) or excludes the clock (clock_not_accepted), a side is at its game cap or
            playing the weekly tournament (bot_busy), the target's inbox is full (inbox_full), or
            the challenger already has a challenge pending with the target (challenge_pending).
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeForbiddenError"
          description: "Either bot is delisted (delisted), or the challenger's owner is banned (banned).
            own_bot is no longer sent: a challenge between two bots of one owner is played unrated."
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeQuotaError"
          description: Per UTC day a bot sends at most 200 challenges (daily_challenge_cap) and plays at most
            100 rated bot-vs-bot games (daily_bot_cap), and a pair 20 (daily_pair_cap), with
            Retry-After running to 00:00 UTC; or too many requests (rate_limited).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Challenge another bot.
      tags:
        - Challenge
  /api/bot/game/{gameId}/resign:
    post:
      description: The opponent wins with reason surrender; no engine session is needed.
      operationId: resignBotGame
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
          description: Resigned.
        "400":
          $ref: "#/components/responses/GameOver"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
          description: Missing, unknown, expired, or rotated game token.
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security:
        - gameToken: []
      summary: Resign a game with its game token.
      tags:
        - Engine session
  /api/bot/game/{gameId}/socket:
    get:
      description: "Speaks htttx basic_websocket v1-alpha: the bot dials, then answers each move_request
        with a move_response of two cells that echoes its request_id, or the answer is dropped. The
        bot declares no capabilities but must handle move_skips, so previous may hold several turns,
        and request_id. A new connection replaces the previous one. An illegal move forfeits."
      operationId: openEngineSession
      parameters:
        - $ref: "#/components/parameters/GameId"
        - description: The game token from the gameStart line.
          in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: "Switching protocols; the engine session is open. The server first sends setup, whose
            board holds the origin stone alone. On each of the bot's turns it sends move_request
            with side, request_id, move_time_limit in seconds when there is a clock, and previous:
            every turn this connection has not seen, the opening's included, oldest first, as {side,
            pieces}. Every 10 s it sends heartbeat, with waiting true while it waits on this bot's
            move; the bot never answers a heartbeat, and a bot that hears waiting true while it is
            not working on a move hangs up and redials. No frame the server sends exceeds 64 KiB. It
            closes with 1009 for a bot frame over 16 KiB, with 1008 after more than 10 frames in one
            session that answer no outstanding request, a malformed frame, or a protocol violation,
            and with 1008 when more than 128 KiB go unread. A close forfeits nothing, but the clock
            runs; dial again while the game token is valid. A move's evaluation and up to two
            considerations, when present, are published with the finished game."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
          description: Unknown game, or a game token that is expired or rotated.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A seat dials at most 5 at once, then 1 every 10 s (rate_limited), or too many requests;
            a refused dial leaves an open session alone. Retry after Retry-After.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      security: []
      summary: Open the per-game engine session.
      tags:
        - Engine session
  /api/bot/stream:
    get:
      description: One StreamEvent per line, with a bare newline as keepalive every 10 s. Opening a stream
        closes the bot's previous one. The bot is online while its stream is open. On open, each
        active game replays as gameStart, followed on the bot's turn by moveRequest, which is
        deprecated. Play runs on the engine session that gameStart hands out.
      operationId: openStream
      parameters:
        - description: "Present as 1, the bot is open while the stream is: other bots may challenge it, and
            players on the website may start games against it, which arrive as gameStart with no
            challenge. Its owner's games against it, the games of duels and round robins its owner
            set up, and the weekly tournament's games reach it without open=1."
          in: query
          name: open
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/StreamEvent"
          description: The event stream, as NDJSON; no line is longer than 64 KiB. The server ends a stream
            that leaves more than 128 KiB unread. A bot whose stream stays closed for 30 s forfeits
            its live games.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BotUnauthorized"
        "403":
          $ref: "#/components/responses/Banned"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: A bot opens at most 5 at once, then 1 every 10 s (rate_limited), or too many requests;
            a refused open leaves the open stream alone. Retry after Retry-After.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "503":
          $ref: "#/components/responses/Paused"
      security:
        - bearerAuth: []
      summary: Open the bot's event stream.
      tags:
        - Stream
  /api/bots:
    get:
      description: The listed roster, ordered by name fold, without pagination. Delisted bots and bots of
        banned owners are hidden.
      operationId: listBots
      parameters:
        - description: Present as 1, narrows the roster to bots holding a stream open.
          in: query
          name: online
          required: false
          schema:
            enum:
              - "1"
            type: string
        - description: Present as 1, narrows the roster to bots that declare an analyzer.
          in: query
          name: analyzer
          required: false
          schema:
            enum:
              - "1"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BotListing"
                type: array
          description: The roster.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
      summary: List public bots.
      tags:
        - Directory
servers:
  - description: The origin of whichever deployment serves this contract.
    url: /
tags:
  - description: The public bot roster.
    name: Directory
  - description: The one NDJSON event stream a bot holds open, and its availability.
    name: Stream
  - description: The bot's identity, rating, and declaration.
    name: Account
  - description: The per-game websocket a bot plays on, and resigning.
    name: Engine session
  - description: The websocket an analyzer reads positions on.
    name: Analysis session
  - description: Creating, accepting, declining, and canceling challenges.
    name: Challenge
webhooks: {}
