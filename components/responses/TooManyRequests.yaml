description: >-
  Rate limit exceeded. Back off and retry. Treat a `429` as a signal to pause
  for **at least one minute** before retrying; if a `Retry-After` header is
  present, honour it. Opening many streams or hammering move submissions are
  the usual causes.
headers:
  Retry-After:
    description: Seconds to wait before retrying. When absent, back off for at least 60 seconds.
    schema:
      type: integer
      format: int32
      minimum: 1
    example: 60
content:
  application/json:
    schema:
      $ref: ../schemas/Error.yaml
    example:
      error: rate-limited
      message: Too many requests; back off for at least one minute.
