description: >-
  **409 game-finished.** The game has already ended, so it cannot be acted on
  again. A recently finished game is reported here while the server still retains
  it; once it is reaped a late resign may instead return `404`. Either way,
  reconcile the terminal result from the `gameFinish` event on the global stream,
  not from this status code.
content:
  application/json:
    schema:
      $ref: ../schemas/Error.yaml
    example:
      error: game-finished
      message: This game has already finished.
