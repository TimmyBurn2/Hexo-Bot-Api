description: >-
  The request body was well-formed but its `clock` is not a usable time control:
  for example both `initial` and `inc` are zero, or the values fall outside the
  range the server allows. Supply a valid clock and retry.
content:
  application/json:
    schema:
      $ref: ../schemas/Error.yaml
    example:
      error: invalid-clock
      message: clock must leave playable time; initial and inc cannot both be zero.
