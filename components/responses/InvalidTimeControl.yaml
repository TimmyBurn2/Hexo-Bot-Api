description: >-
  The request body was well-formed but its `clock` is not a usable time control:
  for example a `turn` mode with a zero `turnTimeMs`, or values outside the range
  the server allows. Supply a valid time control and retry.
content:
  application/json:
    schema:
      $ref: ../schemas/Error.yaml
    example:
      error: invalid-time-control
      message: time control is not usable; a turn budget must leave playable time.
