description: >-
  The request body was well-formed but its ladder-mode parameters are
  inconsistent: `mode: wallclock` without a `clock`, `mode: fixedsim` without a
  `simBudget`, or a control supplied for the mode that does not use it. Fix the
  mode parameters and retry.
content:
  application/json:
    schema:
      $ref: ../schemas/Error.yaml
    example:
      error: invalid-mode-params
      message: wallclock mode requires a clock; none was provided.
