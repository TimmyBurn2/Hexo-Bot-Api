type: object
title: BotInstance
description: >-
  A registered bot instance: the rated, listed, challengeable unit. It owns a
  permanent `id` (handle), a display `name`, its own revocable token, and an
  `owner` link to the operator that runs it. One operator may run many
  instances. Unlike `Player` (which is embedded in every challenge and game
  event), `BotInstance` carries owner-bearing identity and is never inlined into
  challenge or game-event objects.
required:
  - id
  - name
  - owner
additionalProperties: false
properties:
  id:
    type: string
    description: Permanent handle, never reused.
    pattern: "^[a-z0-9_]{3,20}$"
    example: krakenbot
  name:
    type: string
    description: Display name. Defaults to the handle when none was given at registration.
    example: KrakenBot
  owner:
    type: string
    description: Server-assigned operator id, never reassigned. Same-owner games are always unrated via this link.
    pattern: "^[A-Za-z0-9_]{3,40}$"
    example: op_7Qm2Kx
  rating:
    type: integer
    format: int32
    description: Current ladder rating. Server-authoritative; absent until the first rated game.
    example: 1500
  title:
    type: string
    description: Account title/badge. `BOT` marks a registered bot account.
    enum:
      - BOT
    example: BOT
  capabilities:
    description: >-
      What this instance can do and which engine modes it speaks. Declared at
      registration; server-authoritative and read-only thereafter. Label and
      eligibility marker only, not used as a rating or pairing input. Absent
      unless declared.
    $ref: ./Capabilities.yaml
  hardware:
    description: Opt-in coarse hardware self-report. Absent unless the operator opted in at registration.
    $ref: ./HardwareInfo.yaml
  scopes:
    type: array
    description: Token scopes. Always `bot:play`; instance tokens never carry `bot:register` or `bot:organize`.
    items:
      type: string
      enum:
        - bot:play
    example:
      - bot:play
example:
  id: krakenbot
  name: KrakenBot
  owner: op_7Qm2Kx
  rating: 1500
  title: BOT
  scopes:
    - bot:play
  capabilities:
    meta:
      name: KrakenEngine
      description: MCTS, 2M playouts/move
      version: 1.4.0
      tags:
        - mcts
    basic_websocket:
      versions:
        v1-alpha:
          api_root: bws/v1-alpha
          move_time_limit: true
    matchmaking:
      versions:
        v1-alpha:
          honors_move_time_limit: true
    ladder:
      ladderPairing: true
      bulkPairing: true
  hardware:
    gpu: consumer
    cpu_cores: 16
    ram_gb: 64
