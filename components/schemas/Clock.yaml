type: object
title: Clock
description: >-
  Real-time control for a game. Both fields are in **milliseconds**. Every game
  carries a clock; each side's clock ticks while it is to move.
required:
  - initial
  - inc
additionalProperties: false
properties:
  initial:
    type: integer
    format: int64
    minimum: 0
    description: Initial time on each player's clock, in milliseconds.
  inc:
    type: integer
    format: int64
    minimum: 0
    description: Increment added to a player's clock after each compound turn, in milliseconds.
example:
  initial: 300000
  inc: 2000
