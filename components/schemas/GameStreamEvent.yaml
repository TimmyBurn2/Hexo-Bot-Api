title: GameStreamEvent
description: >-
  One line of the **per-game stream** (`GET /api/bot/game/stream/{gameId}`).
  The **first** line is always a `gameFull` (complete snapshot); every line
  thereafter is a `gameState` (cumulative move list + clocks + status). An
  observe-only `opponentGone` line may also appear if the opponent disconnects
  mid-game. Discriminated on `type`.
oneOf:
  - $ref: ./GameFull.yaml
  - $ref: ./GameState.yaml
  - $ref: ./OpponentGoneEvent.yaml
discriminator:
  propertyName: type
  mapping:
    gameFull: ./GameFull.yaml
    gameState: ./GameState.yaml
    opponentGone: ./OpponentGoneEvent.yaml
