type: object
title: GameEventInfo
description: >-
  Lightweight pointer to a game, carried by `gameStart`, `gameFinish`, and the
  active-games list. `id` identifies the game and `side` is the side this bot
  plays. On `gameStart` the engine session to play the game is carried alongside
  on the event.
required:
  - id
  - side
  - opponent
  - variant
  - rated
additionalProperties: false
properties:
  id:
    type: string
    description: The game id. Identifies the game across events and the active-games list.
    example: J9kP2qLm
  side:
    description: The side **this bot** plays in the game.
    $ref: ./Side.yaml
  opponent:
    description: The opposing player.
    $ref: ./Player.yaml
  variant:
    description: The game variant (single-source constant).
    $ref: ./Variant.yaml
  rated:
    type: boolean
    description: Whether the result affects ratings. Useful for bulk-paired games that have no Challenge object.
  status:
    type: string
    description: >-
      Coarse lifecycle flag. Present on `gameFinish`, where it is always
      `finished`; omitted on `gameStart`, where the game is just beginning.
    enum:
      - finished
  finishReason:
    type: string
    description: >-
      Why the game ended. Present on `gameFinish`. Bots are draw-free so
      `draw-agreement` never appears here. `illegal-move` forfeits the side
      whose move was illegal, misapplied, or otherwise unmatched.
    enum:
      - surrender
      - timeout
      - disconnect
      - terminated
      - six-in-a-row
      - illegal-move
  winner:
    description: >-
      Winning side: the achiever on `six-in-a-row`, the opponent on `surrender`,
      `timeout`, `disconnect`, or `illegal-move`. `null` on `terminated`; may
      be `null` on `disconnect` when no side survives.
    oneOf:
      - $ref: ./Side.yaml
      - type: "null"
allOf:
  # gameFinish (status finished) always carries a result; gameStart omits
  # status and carries neither finishReason nor winner.
  - if:
      required:
        - status
      properties:
        status:
          const: finished
    then:
      required:
        - finishReason
        - winner
  - if:
      not:
        required:
          - status
    then:
      not:
        anyOf:
          - required:
              - finishReason
          - required:
              - winner
example:
  id: J9kP2qLm
  side: p1
  opponent:
    id: sealbot
    name: SealBot
    rating: 1480
    title: BOT
  variant: httt6
  rated: true
