type: object
title: GameEventInfo
description: >-
  Lightweight pointer to a game, carried by `gameStart` and `gameFinish`
  events. The bot uses `id` to open the per-game stream
  (`GET /api/bot/game/stream/{id}`) and `side` to know which side it plays.
required:
  - id
  - side
  - opponent
  - variant
  - rated
additionalProperties: false
properties:
  id:
    type: string
    description: The game id. Open the per-game stream with this.
    example: J9kP2qLm
  side:
    description: The side **this bot** plays in the game.
    $ref: ./Side.yaml
  opponent:
    description: The opposing player.
    $ref: ./Player.yaml
  variant:
    description: The game variant (single-source constant).
    $ref: ./Variant.yaml
  rated:
    type: boolean
    description: >-
      Whether the result affects ratings. Server-authoritative; lets a
      bulk-paired bot know its game's rated-ness without a Challenge object.
  status:
    type: string
    description: >-
      Coarse lifecycle flag. Present on `gameFinish`, where it is always
      `finished`; omitted on `gameStart`, where the game is just beginning.
    enum:
      - started
      - finished
  finishReason:
    type: string
    description: >-
      Why the game ended. Present on `gameFinish`. Bots are draw-free, so the
      server's `draw-agreement` reason never appears on this surface.
    enum:
      - surrender
      - timeout
      - disconnect
      - terminated
      - six-in-a-row
  winner:
    description: >-
      The winning side on a decisive `gameFinish`: the line maker on
      `six-in-a-row`, the opponent on `surrender`, `timeout`, or `disconnect`.
      `null` on `terminated`, which finishes the game with no winner.
    oneOf:
      - $ref: ./Side.yaml
      - type: "null"
example:
  id: J9kP2qLm
  side: p1
  opponent:
    id: sealbot
    name: SealBot
    rating: 1480
    title: BOT
  variant: httt6
  rated: true
