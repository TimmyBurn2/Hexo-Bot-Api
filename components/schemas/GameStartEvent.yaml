type: object
title: GameStartEvent
description: >-
  A game you are in has started. Member of the global event stream union. The
  event carries the `engine` dial bootstrap: open that engine session to play the
  game. This spec stops at the session boundary; moves are exchanged over the
  engine protocol, not here.
required:
  - type
  - game
  - engine
additionalProperties: false
properties:
  type:
    type: string
    description: Discriminator. Always `gameStart`.
    const: gameStart
  game:
    description: Pointer to the started game.
    $ref: ./GameEventInfo.yaml
  engine:
    description: >-
      Server-issued dial bootstrap for this game's engine session: where to
      connect and the short-lived per-game token to present. Read-only.
    $ref: ./EngineSession.yaml
example:
  type: gameStart
  game:
    id: J9kP2qLm
    side: p1
    opponent:
      id: sealbot
      name: SealBot
      rating: 1480
      title: BOT
    variant: httt6
    rated: true
  engine:
    socketUrl: wss://hexo.did.science/engine/J9kP2qLm
    token: egs_4c1f9b2a7d3e
