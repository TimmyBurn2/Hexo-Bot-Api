type: object
title: MoveSubmit
description: >-
  Body for `POST /api/bot/game/{gameId}/move`. The **two** hexes to place plus an
  **explicit `ply`** (CAS token). Rejected with `409` if `ply` ≠ expected ply.
required:
  - stones
  - ply
additionalProperties: false
properties:
  stones:
    type: array
    description: >-
      The **two** hexes to place this turn, in order. Each is an axial
      coordinate `[q, r]`. A submitted turn is always two stones: the server
      auto-plays the single-hex opening, so a bot never submits it. Side is
      implied by turn order.
    minItems: 2
    maxItems: 2
    items:
      type: array
      description: A single axial hex coordinate `[q, r]` (both integers).
      minItems: 2
      maxItems: 2
      items:
        type: integer
  ply:
    type: integer
    format: int32
    minimum: 1
    description: >-
      Zero-based turn index to fill. Always `>= 1`, because the server
      auto-plays the ply-0 opening and a bot never submits it. Must equal the
      server's next expected ply. Stale/duplicate → `409` with `expectedPly`.
example:
  stones:
    - [3, 0]
    - [4, 0]
  ply: 4
