type: object
title: MoveSubmit
description: >-
  Body for `POST /api/bot/game/{gameId}/move`. The **two** hexes to place plus an
  **explicit `ply`** (CAS token). Rejected with `409` if `ply` ≠ expected ply.
  The two stones form one atomic turn: they are applied together or not at all.
  A `422` places neither stone and leaves the expected ply unchanged, so a
  rejected turn is corrected by resubmitting both stones at the same `ply`.
required:
  - stones
  - ply
additionalProperties: false
properties:
  stones:
    type: array
    description: The two hexes to place this turn, in order; each is an axial coordinate `[q, r]`. Side is implied by turn order.
    minItems: 2
    maxItems: 2
    items:
      type: array
      description: A single axial hex coordinate `[q, r]` (both integers).
      minItems: 2
      maxItems: 2
      items:
        type: integer
  ply:
    type: integer
    format: int32
    minimum: 1
    description: CAS token; must equal the server's next expected ply. Always `>= 1` (the server auto-plays ply 0). Stale/duplicate → `409` with `expectedPly`.
example:
  stones:
    - [3, 0]
    - [4, 0]
  ply: 4
