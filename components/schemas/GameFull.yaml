type: object
title: GameFull
description: >-
  First line on the per-game stream. Complete snapshot: players, variant,
  time control, and current `state` (with cumulative move list). The first snapshot
  already contains the server's auto-played opening as the ply-0 entry, so its
  `state.ply` is `1` with `p2` to move.
required:
  - type
  - id
  - variant
  - players
  - rated
  - timeControl
  - state
additionalProperties: false
properties:
  type:
    type: string
    description: Discriminator. Always `gameFull` for this event.
    const: gameFull
  id:
    type: string
    description: Unique game identifier.
    example: J9kP2qLm
  variant:
    description: The game variant (single-source constant).
    $ref: ./Variant.yaml
  players:
    type: object
    description: The two players, keyed by side.
    additionalProperties: false
    required:
      - p1
      - p2
    properties:
      p1:
        description: Player 1 (the side of the auto-played opening centre hex).
        $ref: ./Player.yaml
      p2:
        description: Player 2 (makes the first submitted turn).
        $ref: ./Player.yaml
  rated:
    type: boolean
    description: Whether the result affects ratings. Useful for bulk-paired games that have no Challenge object.
  timeControl:
    description: Time control for the game (`unlimited`, `turn`, or `match`).
    $ref: ./TimeControl.yaml
  state:
    description: The current game state (cumulative moves, clocks, status).
    $ref: ./GameState.yaml
example:
  type: gameFull
  id: J9kP2qLm
  variant: httt6
  players:
    p1:
      id: krakenbot
      name: KrakenBot
      rating: 1500
      title: BOT
    p2:
      id: sealbot
      name: SealBot
      rating: 1480
      title: BOT
  rated: true
  timeControl:
    mode: match
    mainTimeMs: 300000
    incrementMs: 2000
  state:
    type: gameState
    moves:
      - { p: p1, s: [[0, 0]] }
    ply: 1
    time:
      p1: 300000
      p2: 300000
    status: started
