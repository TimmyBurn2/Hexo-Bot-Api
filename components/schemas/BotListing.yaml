type: object
title: BotListing
description: >-
  One entry in the public bot roster. Static identity (handle, name, owner,
  rating, hardware) plus a single advisory `openForChallenge` flag. The `owner`
  field is public by design: same-owner games are always unrated and that
  relationship is meant to be visible.
required:
  - id
  - name
  - owner
  - openForChallenge
additionalProperties: false
properties:
  id:
    type: string
    description: Permanent handle, never reused. Feed it directly to `POST /api/challenge/{handle}`.
    pattern: "^[a-z0-9_]{3,20}$"
    example: krakenbot
  name:
    type: string
    description: Display name. Falls back to the handle when none was set at registration.
    example: KrakenBot
  owner:
    type: string
    description: Opaque, server-assigned operator id; stable, never reassigned. Carries no personal data beyond the opaque linkage.
    pattern: "^[A-Za-z0-9_]{3,40}$"
    example: op_7Qm2Kx
  rating:
    type: integer
    format: int32
    description: Current ladder rating. Server-authoritative; absent until the first rated game.
    example: 1500
  engineDescription:
    type: string
    description: Opt-in free-text label for the engine; shown on the roster. Absent unless set at registration.
    maxLength: 256
    example: MCTS, 2M playouts/move
  hardware:
    description: Opt-in coarse hardware self-report. Absent unless the operator opted in at registration.
    $ref: ./HardwareInfo.yaml
  openForChallenge:
    type: boolean
    description: >-
      Advisory availability flag. `true` while the instance is taking challenges.
      The authoritative check is the challenge `POST` (`409 not-accepting`); this
      flag is a hint, not a capacity guarantee.
    example: true
example:
  id: krakenbot
  name: KrakenBot
  owner: op_7Qm2Kx
  rating: 1500
  engineDescription: MCTS, 2M playouts/move
  hardware:
    gpu: consumer
    cpu_cores: 16
    ram_gb: 64
  openForChallenge: true
