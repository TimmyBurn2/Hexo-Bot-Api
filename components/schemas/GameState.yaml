type: object
title: GameState
description: Per-ply event on the per-game stream, after the initial `gameFull`. Carries the cumulative `moves` list. Replay it to rebuild the board.
required:
  - type
  - moves
  - ply
  - status
additionalProperties: false
properties:
  type:
    type: string
    description: Discriminator. Always `gameState` for this event.
    const: gameState
  moves:
    type: array
    description: All turns played so far, oldest first; position equals ply index.
    items:
      $ref: ./CompoundMove.yaml
  ply:
    type: integer
    format: int32
    minimum: 0
    description: Turns played so far (`moves.length`). The next expected submit `ply` equals this value.
  time:
    description: >-
      Remaining time per side in milliseconds. Present under `turn` and `match`
      controls; omitted or `null` under `unlimited`.
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - p1
          - p2
        properties:
          p1:
            type: integer
            format: int64
            minimum: 0
            description: Player 1's remaining time in milliseconds.
          p2:
            type: integer
            format: int64
            minimum: 0
            description: Player 2's remaining time in milliseconds.
      - type: "null"
  status:
    type: string
    description: >-
      Coarse lifecycle flag. `started` while the game is in progress,
      `finished` once it has ended. The reason and result of a finish live in
      `finishReason` and `winner`.
    enum:
      - started
      - finished
  finishReason:
    type: string
    description: Why the game ended. Present only when `status` is `finished`. Bots are draw-free, so `draw-agreement` never appears here.
    enum:
      - surrender
      - timeout
      - disconnect
      - terminated
      - six-in-a-row
  winner:
    description: >-
      Winning side once `status` is `finished`. `null` on `terminated` (no
      winner) and may be `null` on `disconnect` when no side survives.
    oneOf:
      - $ref: ./Side.yaml
      - type: "null"
allOf:
  # A finished game always reports a result; an in-progress game never does.
  - if:
      required:
        - status
      properties:
        status:
          const: finished
    then:
      required:
        - finishReason
        - winner
  - if:
      required:
        - status
      properties:
        status:
          const: started
    then:
      not:
        anyOf:
          - required:
              - finishReason
          - required:
              - winner
example:
  type: gameState
  moves:
    - { p: p1, s: [[0, 0]] }
    - { p: p2, s: [[0, 1], [1, 1]] }
    - { p: p1, s: [[1, 0], [2, 0]] }
  ply: 3
  time:
    p1: 297000
    p2: 298500
  status: started
