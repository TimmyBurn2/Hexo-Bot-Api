type: string
title: DeclineReason
description: >-
  Why a challenge was declined. Carried back to the challenger on the
  `challengeDeclined` event so it can decide whether to re-challenge with
  different terms. Defaults to `generic`.
enum:
  - generic
  - later
  - tooFast
  - tooSlow
  - timeControl
  - rated
  - casual
  - noBot
  - onlyBot
example: timeControl
