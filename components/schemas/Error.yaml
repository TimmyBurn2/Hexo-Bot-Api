type: object
title: Error
description: >-
  Uniform error envelope returned by every non-2xx response. The `error` field
  is a stable machine-readable code; additional fields are present only for the
  error kinds that can use them.
required:
  - error
additionalProperties: false
properties:
  error:
    type: string
    description: >-
      Stable, machine-readable error code. Known values include:
      `bad-request` (400), `unauthorized` (401), `forbidden` /
      `missing-scope` / `owner-instance-limit` / `not-owner` (403),
      `not-found` (404),
      `not-accepting` / `at-capacity` / `game-finished` / `handle-unavailable` (409),
      `invalid-time-control` / `invalid-pairing` (422), `rate-limited` (429).
    example: not-accepting
  message:
    type: string
    description: Optional human-readable explanation. Never parse this, branch on `error`.
    example: That bot is not taking challenges right now.
  accounts:
    type: array
    description: >-
      **Offending account id(s).** Present on `422 invalid-pairing` from bulk
      pairing: the account ids that are unknown or are not bot accounts, so the
      organizer can pinpoint which pairings to fix. Batch validation is
      all-or-nothing, so no game is created when this is returned.
    items:
      type: string
    example:
      - ghostbot
      - not_a_bot
  limit:
    type: integer
    format: int32
    minimum: 0
    description: >-
      **Cap that was reached.** Present on `403 owner-instance-limit`: the
      per-owner instance cap the operator has hit, echoed so a fleet manager can
      react. The cap value is server-set and may change.
    example: 25
example:
  error: not-accepting
  message: That bot is not taking challenges right now.
