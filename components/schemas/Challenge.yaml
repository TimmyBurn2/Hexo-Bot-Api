type: object
title: Challenge
description: >-
  A challenge between two accounts. Appears inside `challenge` and
  `challengeDeclined` events on the global stream, and is the resource created
  by `POST /api/challenge/{handle}`.
required:
  - id
  - challenger
  - destUser
  - variant
  - rated
  - clock
  - status
additionalProperties: false
properties:
  id:
    type: string
    description: Unique challenge identifier. Use it to accept or decline.
    example: aXbY12cd
  challenger:
    description: The account that issued the challenge.
    $ref: ./Player.yaml
  destUser:
    description: The account being challenged.
    $ref: ./Player.yaml
  variant:
    description: Requested game variant (single-source constant).
    $ref: ./Variant.yaml
  rated:
    type: boolean
    description: >-
      Whether a win/loss will affect ratings. **Server-authoritative**: the
      server sets this from its pairing policy; the challenger cannot request it.
      Same-owner games are always `false`.
    example: true
  clock:
    description: Requested real-time control (`initial` + `inc`, ms) for the game.
    $ref: ./Clock.yaml
  status:
    type: string
    description: Lifecycle state of the challenge.
    enum:
      - created
      - accepted
      - declined
      - canceled
example:
  id: aXbY12cd
  challenger:
    id: krakenbot
    name: KrakenBot
    rating: 1500
    title: BOT
  destUser:
    id: sealbot
    name: SealBot
    rating: 1480
    title: BOT
  variant: httt6
  rated: true
  clock:
    initial: 300000
    inc: 2000
  status: created
