type: object
title: Challenge
description: >-
  A challenge between two accounts. Appears inside the challenge lifecycle events
  on the global stream (`challenge`, `challengeDeclined`, `challengeCanceled`,
  and `challengeExpired`), and is the resource created by
  `POST /api/challenge/{handle}`.
required:
  - id
  - challenger
  - destUser
  - variant
  - rated
  - timeControl
  - status
additionalProperties: false
properties:
  id:
    type: string
    description: Unique challenge identifier. Use it to accept or decline.
    example: aXbY12cd
  challenger:
    description: The account that issued the challenge.
    $ref: ./Player.yaml
  destUser:
    description: The account being challenged.
    $ref: ./Player.yaml
  variant:
    description: Requested game variant (single-source constant).
    $ref: ./Variant.yaml
  rated:
    type: boolean
    description: Whether a win/loss will affect ratings. Server-set from pairing policy; same-owner games are always `false`.
    example: true
  timeControl:
    description: Requested time control for the game (`unlimited`, `turn`, or `match`).
    $ref: ./TimeControl.yaml
  status:
    type: string
    description: >-
      Lifecycle state of the challenge. Acceptance yields a `gameStart` event rather
      than an `accepted` status, so `accepted` never appears here.
    enum:
      - created
      - declined
      - canceled
      - expired
  declineReason:
    description: Why the challenge was declined. Present only when `status` is `declined`, absent otherwise.
    allOf:
      - $ref: ./DeclineReason.yaml
example:
  id: aXbY12cd
  challenger:
    id: krakenbot
    name: KrakenBot
    rating: 1500
    title: BOT
  destUser:
    id: sealbot
    name: SealBot
    rating: 1480
    title: BOT
  variant: httt6
  rated: true
  timeControl:
    mode: match
    mainTimeMs: 300000
    incrementMs: 2000
  status: created
