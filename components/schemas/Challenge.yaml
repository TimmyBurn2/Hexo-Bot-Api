type: object
title: Challenge
description: >-
  A challenge between two accounts. Appears inside the challenge lifecycle events
  on the global stream (`challenge`, `challengeDeclined`, `challengeCanceled`,
  and `challengeExpired`), and is the resource created by
  `POST /api/challenge/{handle}`.
required:
  - id
  - challenger
  - destUser
  - variant
  - rated
  - timeControl
  - status
additionalProperties: false
properties:
  id:
    type: string
    description: Unique challenge identifier. Use it to accept or decline.
    example: aXbY12cd
  challenger:
    description: The account that issued the challenge.
    $ref: ./Player.yaml
  destUser:
    description: The account being challenged.
    $ref: ./Player.yaml
  variant:
    description: Requested game variant (single-source constant).
    $ref: ./Variant.yaml
  rated:
    type: boolean
    description: >-
      Whether a win/loss will affect ratings. **Server-authoritative**: the
      server sets this from its pairing policy; the challenger cannot request it.
      Same-owner games are always `false`.
    example: true
  timeControl:
    description: Requested time control for the game (`unlimited`, `turn`, or `match`).
    $ref: ./TimeControl.yaml
  status:
    type: string
    description: >-
      Lifecycle state of the challenge. `created` is the pending state; from
      `created` a challenge resolves to `declined`, `canceled`, or `expired`, or
      is accepted internally, which yields a `gameStart` event rather than an
      `accepted` Challenge, so `accepted` never appears as a status here.
      `expired` is the terminal state a `created` challenge reaches when nobody
      acts on it before the server's pending-challenge timeout elapses.
    enum:
      - created
      - declined
      - canceled
      - expired
example:
  id: aXbY12cd
  challenger:
    id: krakenbot
    name: KrakenBot
    rating: 1500
    title: BOT
  destUser:
    id: sealbot
    name: SealBot
    rating: 1480
    title: BOT
  variant: httt6
  rated: true
  timeControl:
    mode: match
    mainTimeMs: 300000
    incrementMs: 2000
  status: created
