type: object
title: CompoundMove
description: >-
  One **turn** in HeXO, as it appears in the cumulative `moves` array of a
  `gameState`. A turn places hexes for one side:


  - **The opening turn (ply 0)** is a **single** hex at the centre `[0, 0]`,
    placed automatically by the server on Player 1's behalf, not submitted by a
    bot. It still appears here as historical board state.

  - **Every turn after that** places **two** hexes, submitted by the side to
    move.

  Position in `moves` is the (zero-based) ply, not repeated on the object.
required:
  - p
  - s
additionalProperties: false
properties:
  p:
    description: The side that made this turn.
    $ref: ./Side.yaml
  s:
    type: array
    description: >-
      The hex(es) placed this turn, in placement order. Each hex is an integer
      **axial coordinate** `[q, r]`. Length is **1** only for the auto-played
      ply-0 opening; otherwise **2**.
    minItems: 1
    maxItems: 2
    items:
      type: array
      description: A single axial hex coordinate `[q, r]` (both integers).
      minItems: 2
      maxItems: 2
      items:
        type: integer
example:
  p: p1
  s:
    - [1, 0]
    - [2, 0]
