type: string
title: Side
description: >-
  Which side a player is on. **Single source of truth** for side identity: every
  schema that names a side `$ref`s this rather than repeating the enum.


  The game opens with a **single** centre hex at `[0, 0]`, placed
  **automatically by the server** on Player 1's behalf at ply 0; `p1` does not
  submit the opening. Thereafter each turn places two hexes.


  - `p1` = **Player 1**: the side the auto-played opening belongs to. Its first
    submitted turn (ply 2) and every turn after place two hexes.

  - `p2` = **Player 2**: makes the first submitted turn (ply 1) and every turn
    places two hexes.


  HeXO has no fixed "colours" in the protocol; the game UI renders the sides
  visually, but the contract identifies them by play order (`p1`/`p2`).
enum:
  - p1
  - p2
example: p1
