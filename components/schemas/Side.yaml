type: string
title: Side
description: >-
  Which side a player is on. **Single source of truth** for side identity: every
  schema that names a side `$ref`s this rather than repeating the enum.


  Sides are identified by **play order**:

  - `p1` = **Player 1**: the side that opens the game.

  - `p2` = **Player 2**: the side that replies.


  How a turn places hexes, and who opens, belong to the **engine protocol**, not
  this contract. HeXO has no fixed "colours" in the protocol; the game UI renders
  the sides visually, but the contract identifies them by play order (`p1`/`p2`).
enum:
  - p1
  - p2
example: p1
