type: string
title: Variant
description: >-
  The variant key, scoped to the serving host's registry. **Single source of
  truth**: every operation that names a variant `$ref`s this. Open string — the
  contract carries the field, not the value set: the reference host serves
  `httt6`, another host may serve a different key, and extending the value set
  is a server-side registry change, not a spec edit. Board geometry and rules
  belong to the engine protocol, not here.
example: httt6
