type: string
title: Variant
description: >-
  The HeXO game variant key. **Single source of truth**: every operation that
  names a variant `$ref`s this schema rather than hard-coding a literal.


  The current (and only) variant is `httt6`, HeXO's hexagonal tic-tac-toe. Its
  board geometry and rules of play (coordinates, legal placement, the opening,
  win conditions) belong to the **engine protocol**, not this contract; here
  `httt6` is just the key carried on challenges and games.


  This value **must match the variant key registered on the server**
  (`hexo.did.science`) and in its variant registry. If the server adds variants,
  extend this enum here first.
enum:
  - httt6
default: httt6
example: httt6
