type: string
title: Variant
description: >-
  The HeXO game variant key. **Single source of truth**: every operation that
  names a variant `$ref`s this schema rather than hard-coding a literal, so the
  constant is defined exactly once in this repo.


  The current (and only) variant is `httt6`, HeXO, the *infinite hexagonal
  tic-tac-toe* game. The coordinate space is unbounded (integer axial
  coordinates, any value), but legal placement is confined to a bounded playable
  region that expands outward as stones are placed, so at the opening only the
  centre `[0, 0]` is available. Player 1 opens with that single centre hex;
  thereafter each turn places two hexes. **Win by connecting six of your own
  hexes in a straight line along any of the three board axes.**


  This value **must match the variant key registered on the server**
  (`hexo.did.science`) and in its variant registry. If the server adds variants,
  extend this enum here first.
enum:
  - httt6
default: httt6
example: httt6
