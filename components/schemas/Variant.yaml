type: string
title: Variant
description: >-
  The HeXO game variant key. **Single source of truth**: every operation that
  names a variant `$ref`s this schema rather than hard-coding a literal.


  The current (and only) variant is `httt6`, HeXO's hexagonal tic-tac-toe.
  Legal placement is within hex-distance 8 of any placed stone; the frontier
  widens as stones are placed. The server auto-plays the opening centre hex on
  Player 1's behalf; every submitted turn places two hexes. **Win by connecting
  six of your own hexes in a straight line along any of the three board axes.**
  Out-of-frontier placement → `422 out-of-bounds`.


  This value must match the variant key registered on the server
  (`hexo.did.science`). If the server adds variants, extend this enum here first.
enum:
  - httt6
default: httt6
example: httt6
