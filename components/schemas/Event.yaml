title: Event
description: >-
  One line of the **global event stream** (`GET /api/stream/event`). Each line
  is exactly one of these objects, discriminated on the `type` field. A client
  reads the stream line by line and dispatches on `type`.
oneOf:
  - $ref: ./ChallengeEvent.yaml
  - $ref: ./GameStartEvent.yaml
  - $ref: ./GameFinishEvent.yaml
  - $ref: ./OpponentGoneEvent.yaml
  - $ref: ./ChallengeDeclinedEvent.yaml
  - $ref: ./ChallengeCanceledEvent.yaml
  - $ref: ./ChallengeExpiredEvent.yaml
discriminator:
  propertyName: type
  mapping:
    challenge: ./ChallengeEvent.yaml
    gameStart: ./GameStartEvent.yaml
    gameFinish: ./GameFinishEvent.yaml
    opponentGone: ./OpponentGoneEvent.yaml
    challengeDeclined: ./ChallengeDeclinedEvent.yaml
    challengeCanceled: ./ChallengeCanceledEvent.yaml
    challengeExpired: ./ChallengeExpiredEvent.yaml
