# Redocly CLI config: lint, bundle, and docs for the HeXO Bot API spec.
# Run:  make lint  /  make bundle  /  make docs

extends:
  - recommended

rules:
  # Every operation is fully described and uniquely addressable.
  operation-operationId: error
  operation-operationId-unique: error
  operation-summary: error

  # Every operation documents success and at least one error response.
  operation-2xx-response: error
  operation-4xx-response: error

  # No orphan or dangling pieces.
  no-unused-components: error
  no-unresolved-refs: error

  # Examples must validate against their schemas. The vendored htttx block
  # carries upstream examples; this catches a bad bump.
  no-invalid-media-type-examples: error
  no-invalid-schema-examples: error
  no-required-schema-properties-undefined: error

  # Tags used by operations must be declared, with descriptions, at the root.
  operation-tag-defined: error
  tag-description: error

# Docs rendering options (used by `redocly build-docs`).
openapi:
  schemaExpansionLevel: 2
