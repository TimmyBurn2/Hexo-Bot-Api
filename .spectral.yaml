# Spectral ruleset, secondary linter, extends the built-in OpenAPI rules.
# Run:  make lint-spectral

extends:
  - spectral:oas

rules:
  # Reinforce the same governance Redocly enforces, so either linter alone
  # catches an undocumented operation.
  operation-operationId: error
  operation-operationId-unique: error
  operation-tag-defined: error
  operation-description: warn

  # Redocly validates examples as errors; Spectral's overlapping heuristic on
  # the vendored htttx examples adds no signal, so keep it non-fatal.
  oas3-valid-media-example: warn
  oas3-valid-schema-example: warn
