# Spectral ruleset, secondary linter, extends the built-in OpenAPI rules.
# Run:  make lint-spectral

extends:
  - spectral:oas

rules:
  # Raise these from warn to error, so Spectral alone fails an operation with no
  # id or an undeclared tag. The rest of spectral:oas is left at its defaults.
  operation-operationId: error
  operation-tag-defined: error
