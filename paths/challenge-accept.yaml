post:
  operationId: acceptChallenge
  summary: Accept an incoming challenge
  description: >-
    Accepts the challenge `challengeId`. On success a game is created and both
    participants receive a `gameStart` event on their global event streams. The
    response carries the new game's `gameId` directly, so the acceptor can open
    the per-game stream at once without waiting for its own `gameStart` event to
    arrive.


    Only a still-pending challenge can be accepted. A challenge that has already
    been accepted, declined, canceled, or expired is no longer pending and is
    reported as `404`; for a state it did not cause, the bot reconciles from the
    `challengeCanceled` or `challengeExpired` event on its global stream rather
    than from this call.
  tags:
    - Challenge
  parameters:
    - name: challengeId
      in: path
      required: true
      description: The challenge id (from a `challenge` event's `challenge.id`).
      schema:
        type: string
      example: aXbY12cd
  responses:
    "200":
      description: The challenge was accepted; a game has started. The body carries its `gameId`.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - gameId
            properties:
              gameId:
                type: string
                description: >-
                  The started game's id. Open the per-game stream
                  (`GET /api/bot/game/stream/{gameId}`) to begin playing, without
                  waiting for the `gameStart` event.
                example: J9kP2qLm
          example:
            gameId: J9kP2qLm
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
