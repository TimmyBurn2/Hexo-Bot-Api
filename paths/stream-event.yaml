get:
  operationId: streamEvents
  summary: Stream incoming events (global, never-closing NDJSON)
  description: >-
    Opens the bot's **global event stream**. This is a long-lived HTTP `GET`
    whose body is **`application/x-ndjson`**: one JSON object per line,
    terminated by `\n`. **The response never closes on its own**: the server
    holds the connection open and pushes a new line whenever an event occurs.


    On connect, the server first replays the bot's current state (any active
    challenges and games), then streams live events as they happen. Each line
    is an `Event`; discriminate on its `type` field (`challenge`, `gameStart`,
    `gameFinish`, `challengeDeclined`, `challengeCanceled`, `challengeExpired`).


    **Keepalive:** while idle, the server emits a **blank line** (just `\n`) **at
    least every 15 seconds** so clients and proxies don't time the socket out,
    and so a client can set a read timeout at a small multiple of that interval
    to tell an idle-but-alive stream from a dead socket. Clients **must** skip
    blank lines rather than attempt to parse them.


    **One stream per token:** opening a new global event stream **closes any
    previous one for the same token**, so a bot reconnecting after a half-open
    drop need not tear down the stale connection first. Read the stream line by
    line; on `gameStart`, open the per-game stream at `game.id` (see
    `/api/bot/game/stream/{gameId}`).
  tags:
    - Stream
  responses:
    "200":
      description: A never-closing NDJSON stream of events (one JSON object per line; blank lines are keepalives).
      content:
        application/x-ndjson:
          schema:
            $ref: ../components/schemas/Event.yaml
          examples:
            gameStart:
              summary: A single gameStart line
              value:
                type: gameStart
                game:
                  id: J9kP2qLm
                  side: p1
                  opponent:
                    id: sealbot
                    name: SealBot
                    rating: 1480
                    title: BOT
                  variant: httt6
                  rated: true
            challenge:
              summary: A single challenge line
              value:
                type: challenge
                challenge:
                  id: aXbY12cd
                  challenger:
                    id: krakenbot
                    name: KrakenBot
                    rating: 1500
                    title: BOT
                  destUser:
                    id: sealbot
                    name: SealBot
                    rating: 1480
                    title: BOT
                  variant: httt6
                  rated: true
                  timeControl:
                    mode: match
                    mainTimeMs: 300000
                    incrementMs: 2000
                  status: created
            challengeCanceled:
              summary: A single challengeCanceled line
              value:
                type: challengeCanceled
                challenge:
                  id: aXbY12cd
                  challenger:
                    id: krakenbot
                    name: KrakenBot
                    rating: 1500
                    title: BOT
                  destUser:
                    id: sealbot
                    name: SealBot
                    rating: 1480
                    title: BOT
                  variant: httt6
                  rated: true
                  timeControl:
                    mode: match
                    mainTimeMs: 300000
                    incrementMs: 2000
                  status: canceled
            challengeExpired:
              summary: A single challengeExpired line
              value:
                type: challengeExpired
                challenge:
                  id: aXbY12cd
                  challenger:
                    id: krakenbot
                    name: KrakenBot
                    rating: 1500
                    title: BOT
                  destUser:
                    id: sealbot
                    name: SealBot
                    rating: 1480
                    title: BOT
                  variant: httt6
                  rated: true
                  timeControl:
                    mode: match
                    mainTimeMs: 300000
                    incrementMs: 2000
                  status: expired
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
