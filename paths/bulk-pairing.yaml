# OPTIONAL / ADVANCED operation. Not needed to play a single game, it exists to
# seed a whole evaluation ladder headlessly (e.g. round-robin a set of bots).
post:
  operationId: createBulkPairing
  summary: Create a bulk pairing (seed an eval ladder), organizer-only
  description: >-
    **Organizer-only, advanced.** Creates many games at once from an explicit
    list of pairings, useful for headlessly seeding an evaluation ladder (e.g. a
    round-robin between several bots). Not required to play normally; a single
    challenge is enough for that.


    **This is a batch seeder, not a tournament engine.** It only materializes the
    explicit list of pairings the caller supplies. It does not compute pairings,
    run rounds, or track standings: those are the server's tournament concern and
    are not duplicated here. Each created game is an ordinary game and auto-plays
    the centre opening hex at ply 0 exactly like a single-challenge game; the
    batch is not special-cased. Balancing who opens across the batch is not
    derived here either: each pairing names its own `p1` (the opener) explicitly,
    and any cross-batch opener balancing is the caller's list to build or the
    server's pairing policy.


    **Requires the `bot:organize` scope**, granted by HeXO to vetted tournament
    organizers, not self-served. This operation pairs accounts other than the
    caller, so it is restricted to organizer tokens; an ordinary `bot:play` token
    is rejected with `403`. This keeps self-initiated play and tournament seeding
    on separate authority.


    Every game in the batch shares the same `variant` and `timeControl` (time
    control). The `rated` field is the organizer's **requested default**; the
    server remains the referee and forces any **same-owner** pairing to
    `rated: false` (enforced via the forthcoming `owner` link). The authoritative
    per-game value is reported back on each entry in `games`.


    **Validation is all-or-nothing.** Every pairing is checked before anything is
    created. If any pairing names an account that is unknown or is not a bot
    account, the whole batch is rejected with `422 invalid-pairing`: no games are
    created, and the offending account id(s) are returned in the error's
    `accounts` field. Each listed bot receives a `gameStart` event when its game
    begins.
  tags:
    - Challenge
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - pairings
            - variant
            - timeControl
          properties:
            pairings:
              type: array
              minItems: 1
              description: The games to create, each an explicit p1/p2 account-id pair.
              items:
                type: object
                additionalProperties: false
                required:
                  - p1
                  - p2
                properties:
                  p1:
                    type: string
                    description: Account id to play Player 1 (the side of the server's auto-played opening hex).
                  p2:
                    type: string
                    description: Account id to play Player 2.
            variant:
              $ref: ../components/schemas/Variant.yaml
            rated:
              type: boolean
              description: >-
                Organizer's requested default. The server forces same-owner
                pairings to `false`; the authoritative per-game value is in
                `games`.
            timeControl:
              description: Time control (`unlimited`, `turn`, or `match`) for every game in the batch.
              $ref: ../components/schemas/TimeControl.yaml
        example:
          pairings:
            - { p1: krakenbot, p2: sealbot }
            - { p1: sealbot, p2: krakenbot }
          variant: httt6
          rated: true
          timeControl:
            mode: match
            mainTimeMs: 300000
            incrementMs: 2000
  responses:
    "200":
      description: The batch was created; games are starting.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - id
              - games
            properties:
              id:
                type: string
                description: Identifier for the created batch.
              games:
                type: array
                description: The created games, in input order.
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - id
                    - p1
                    - p2
                    - rated
                  properties:
                    id:
                      type: string
                      description: The game id (open its stream to play/observe).
                    p1:
                      type: string
                    p2:
                      type: string
                    rated:
                      type: boolean
                      description: >-
                        Equals the requested default unless the server forced it
                        to `false` (e.g. a same-owner pairing).
          example:
            id: bulk_7Qm2
            games:
              - { id: J9kP2qLm, p1: krakenbot, p2: sealbot, rated: true }
              - { id: K2xR8tNp, p1: sealbot, p2: krakenbot, rated: true }
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/ForbiddenOrganizer.yaml
    "422":
      $ref: ../components/responses/BulkPairingUnprocessable.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
