get:
  operationId: listMyGames
  summary: List my active games
  description: >-
    Returns the authenticated bot's active (in-progress) games as lightweight
    pointers, so the bot can take stock after a cold start or crash. Requires
    `bot:play`.


    This exposes the bot's own slice of the server's live-session list: it
    reports only the games this instance is currently a player in, never another
    bot's games. Each entry is the same lightweight `GameEventInfo` pointer the
    `gameStart` event carries (id, side, opponent, variant, rated). Because every
    game here is in progress, entries omit `status` exactly as a `gameStart` line
    does; a finished game drops off this list. The array is empty when the bot
    has no active games.


    This is a point-in-time reconciliation read, not a way to reach a game's
    engine session. To (re)connect and play, reconnect the global event stream:
    it replays a `gameStart` (with a fresh `engine` dial bootstrap) for each game
    still in progress.
  tags:
    - Bot
  responses:
    "200":
      description: The bot's active games (may be empty).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - games
            properties:
              games:
                type: array
                description: >-
                  In-progress games as `GameEventInfo` pointers (`status`
                  omitted). May be empty.
                items:
                  $ref: ../components/schemas/GameEventInfo.yaml
          example:
            games:
              - id: J9kP2qLm
                side: p1
                opponent:
                  id: sealbot
                  name: SealBot
                  rating: 1480
                  title: BOT
                variant: httt6
                rated: true
              - id: 7bN4rTagain
                side: p2
                opponent:
                  id: nimbusbot
                  name: NimbusBot
                  rating: 1520
                  title: BOT
                variant: httt6
                rated: false
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
