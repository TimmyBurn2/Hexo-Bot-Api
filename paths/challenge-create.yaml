post:
  operationId: createChallenge
  summary: Challenge another account to a game
  description: >-
    Creates a challenge from the authenticated bot to the account named by the
    `handle` path parameter. The challenged account receives a `challenge` event
    on its global stream and may accept or decline.


    **Availability is resolved here, not in the roster.** The `openForChallenge`
    flag on `GET /api/bots` is advisory and can go stale between the lookup and
    this call. This `POST` is the authoritative availability check at the moment
    it lands: if the target is not taking the challenge then, the server creates
    nothing and returns `409` (`not-accepting` when the target is closed or its
    event stream is down; `at-capacity` when it advertises open but cannot take
    another game). A missing handle is `404`, distinct from a present-but-closed
    target's `409`. This narrows the race but does not erase it: a `200` means
    the challenge was created and pushed to the target's event stream, not that
    the target received or accepted it. The challenger then waits for the
    opponent's accept or decline and should time out and move on if neither
    arrives.


    **Rated-ness is server-authoritative.** The caller does not request it: the
    server is the referee and decides whether the game is rated from its pairing
    policy, then echoes the authoritative value as `rated` on the returned
    `Challenge` (and in the `challenge` event the opponent receives). Same-owner
    games are **always unrated**, enforced server-side via the forthcoming
    `owner` link. A bot that only wants casual games can still decline with
    reason `rated`.


    Pick **one** ladder mode in the body:

    - `mode: wallclock`, provide a `clock` (`initial` + `inc`, ms). Real clocks
      tick; this measures the whole engine, speed included.

    - `mode: fixedsim`, provide a `simBudget` (per-move simulation budget the
      server enforces for both sides). Clocks do not apply; this compares model
      quality hardware-neutrally.
  tags:
    - Challenge
  parameters:
    - name: handle
      in: path
      required: true
      description: The target account's permanent handle (its `id`), e.g. `sealbot`.
      schema:
        type: string
      example: sealbot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - variant
            - mode
          properties:
            variant:
              $ref: ../components/schemas/Variant.yaml
            mode:
              type: string
              description: Ladder mode. Determines whether `clock` or `simBudget` applies.
              enum:
                - wallclock
                - fixedsim
            clock:
              description: Wall-clock control. Required when `mode` is `wallclock`; omit for `fixedsim`.
              $ref: ../components/schemas/Clock.yaml
            simBudget:
              type: integer
              format: int32
              minimum: 1
              description: Per-move simulation budget. Required when `mode` is `fixedsim`; omit for `wallclock`.
        examples:
          wallclock:
            summary: Wall-clock challenge (5+2)
            value:
              variant: httt6
              mode: wallclock
              clock:
                initial: 300000
                inc: 2000
          fixedsim:
            summary: Fixed-sim challenge (hardware-neutral)
            value:
              variant: httt6
              mode: fixedsim
              simBudget: 100000
  responses:
    "200":
      description: The challenge was created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Challenge.yaml
          example:
            id: aXbY12cd
            challenger:
              id: krakenbot
              name: KrakenBot
              rating: 1500
              title: BOT
            destUser:
              id: sealbot
              name: SealBot
              rating: 1480
              title: BOT
            variant: httt6
            rated: true
            mode: wallclock
            clock:
              initial: 300000
              inc: 2000
            status: created
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "409":
      $ref: ../components/responses/ChallengeRefused.yaml
    "422":
      $ref: ../components/responses/InvalidModeParams.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
