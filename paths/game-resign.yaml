post:
  operationId: resignGame
  summary: Resign a game
  description: >-
    Resigns the game `gameId` on behalf of the authenticated bot. The game ends
    immediately with `finishReason: surrender` and the opponent as `winner`. A
    resign targeting a recently finished game returns `409 game-finished` while
    the server retains it; once it is reaped the resign may instead return `404`,
    so the bot reconciles the terminal result from the `gameFinish` event rather
    than this status code.
  tags:
    - Bot
  parameters:
    - name: gameId
      in: path
      required: true
      description: The game id.
      schema:
        type: string
      example: J9kP2qLm
  responses:
    "200":
      description: The game was resigned.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Ok.yaml
          example:
            ok: true
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "409":
      $ref: ../components/responses/GameFinished.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
