get:
  operationId: getMyAccount
  summary: Get my account (whoami)
  description: >-
    Returns the authenticated bot instance as a `BotInstance`, including its
    `owner` link, current rating (server-authoritative and read-only), its
    granted `scopes`, and, if the operator opted in, its coarse, label-only
    `hardware` self-report. Callable by any valid instance token regardless of
    scope; use it to confirm a token works, learn which `scopes` it carries
    (a bridge handed a token out of band can check `bot:play` is present), and
    learn your own account `id` (and which operator owns you) before challenging
    others.
  tags:
    - Account
  responses:
    "200":
      description: The authenticated bot instance.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BotInstance.yaml
          example:
            id: krakenbot
            name: KrakenBot
            owner: op_7Qm2Kx
            rating: 1500
            title: BOT
            scopes:
              - bot:play
            hardware:
              gpu: consumer
              cpu_cores: 16
              ram_gb: 64
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
