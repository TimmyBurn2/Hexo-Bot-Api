post:
  operationId: makeBotMove
  summary: Make a move (compound turn) in a game
  description: >-
    Submits the bot's **compound turn** (two stones) for `gameId`. The body is
    a `MoveSubmit` carrying the two stones and an **explicit `ply`** index.


    The `ply` is a compare-and-set token: the move is applied only if `ply`
    equals the server's next expected ply. This makes the write **retry-safe
    (no double-apply)**: resubmitting after a flaky-network timeout cannot apply
    the turn twice, because the second submit's `ply` no longer matches the
    expected ply once the first has landed.


    **A compound turn is applied atomically.** Both stones land together or
    neither does. A `422` (illegal placement) applies *neither* stone and leaves
    the expected ply unchanged, so the correct recovery is to choose a legal pair
    and resubmit *both* stones at the same `ply`.


    Error contract:

    - **`409`**: the request conflicts with the game's current state, in one of
      two ways. `not-your-turn` is a stale, duplicate, or out-of-order `ply`
      (CAS miss): no move was applied, and the body carries the authoritative
      `expectedPly` so the bot can resynchronise and resubmit deterministically.
      `game-finished` means the game exists but has already ended, so no further
      move is accepted; a finished game is reported here, never as `404`.

    - **`422`**: it was your turn but the move is illegal: a cell is
      `occupied`, the wrong number of stones was sent (`wrong-stone-count`: a
      submitted turn requires exactly 2 stones), or the placement is otherwise
      rejected. The body carries the offending `stone` when applicable. Because
      the turn is atomic, a `422` places neither stone; resubmit both at the
      same `ply`.
  tags:
    - Bot
  parameters:
    - name: gameId
      in: path
      required: true
      description: The game id.
      schema:
        type: string
      example: J9kP2qLm
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MoveSubmit.yaml
        example:
          stones:
            - [2, -1]
            - [2, 0]
          ply: 4
  responses:
    "200":
      description: The compound turn was applied.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Ok.yaml
          example:
            ok: true
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "403":
      $ref: ../components/responses/Forbidden.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "409":
      $ref: ../components/responses/Conflict.yaml
    "422":
      $ref: ../components/responses/Unprocessable.yaml
    "429":
      $ref: ../components/responses/TooManyRequests.yaml
